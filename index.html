/* ---------- Таймер ---------- */
const seg0=()=>({run:false,start:0,acc:0,last:-1,b:null});
const T={mode:'rounds',run:{running:false,start:0,acc:0,dist:0,unit:'km',lastTs:0,pace:0},rd:{round:180,rest:60,rounds:6,prep:10,warn:true,combo:'box',st:seg0()},iv:{work:20,rest:10,rounds:8,prep:10,st:seg0()},rs:{dur:90,left:90000,end:0,run:false},sw:{run:false,start:0,acc:0,laps:[]},cb:{text:'',next:0}};
function segsRd(){const c=T.rd,s=[{k:'prep',d:c.prep}];for(let r=1;r<=c.rounds;r++){s.push({k:'work',d:c.round,r});if(r<c.rounds)s.push({k:'rest',d:c.rest,r})}return s}
function segsIv(){const c=T.iv,s=[{k:'prep',d:c.prep}];for(let r=1;r<=c.rounds;r++){s.push({k:'work',d:c.work,r});if(r<c.rounds)s.push({k:'rest',d:c.rest,r})}return s}
function segState(cfg,segs,now){const st=cfg.st,el=st.acc+(st.run?now-st.start:0);let t=0;for(let i=0;i<segs.length;i++){const d=segs[i].d*1000;if(el<t+d)return{i,seg:segs[i],left:t+d-el};t+=d}return{done:true}}
function vTimer(){
  const m=T.mode;let face='';
  if(m==='rounds'){const c=T.rd,run=c.st.run||c.st.acc;
    face=`<span class="phase" id="tm-phase">Готовность</span><div class="countdown" id="tm-time">0:10</div><div class="muted" id="tm-round">Раунд 0 из ${c.rounds}</div>
    <div class="combo" id="tm-combo" aria-live="polite"></div>${c.combo!=='off'?'<div class="combo-legend">1 джеб · 2 кросс · 3 левый хук · 4 правый хук · 5, 6 апперкоты</div>':''}
    <div class="row" style="justify-content:center"><button class="btn primary big" data-act="rd-toggle">${c.st.run?'Пауза':run?'Продолжить':'Старт'}</button><button class="btn big ghost" data-act="rd-reset">Сброс</button></div>
    <div class="fields" style="width:100%;max-width:620px">
      <div class="field"><label for="rd-round">Раунд</label><select class="input" id="rd-round" data-rd="round" ${run?'disabled':''}>${[60,90,120,180,300].map(v=>`<option value="${v}" ${c.round===v?'selected':''}>${v<120?v+' с':v/60+' мин'}</option>`).join('')}</select></div>
      <div class="field"><label for="rd-rest">Отдых</label><select class="input" id="rd-rest" data-rd="rest" ${run?'disabled':''}>${[30,45,60,90,120].map(v=>`<option value="${v}" ${c.rest===v?'selected':''}>${v} с</option>`).join('')}</select></div>
      <div class="field"><label for="rd-rounds">Раундов</label><input class="input" id="rd-rounds" data-rd="rounds" type="number" min="1" max="30" value="${c.rounds}" ${run?'disabled':''}></div>
      <div class="field"><label for="rd-combo">Комбинации</label><select class="input" id="rd-combo" data-rd="combo">${[['off','Выключены'],['box','Бокс'],['kick','Кикбоксинг']].map(([k,n])=>`<option value="${k}" ${c.combo===k?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>
    <label class="switch" style="width:100%;max-width:620px"><span>Сигнал за 10 секунд до конца раунда</span><input type="checkbox" id="rd-warn" data-rd="warn" ${c.warn?'checked':''}></label>`}
  if(m==='interval'){const v=T.iv,run=v.st.run||v.st.acc,tot=segsIv().reduce((a,s)=>a+s.d,0);
    face=`<span class="phase" id="tm-phase">Готовность</span><div class="countdown" id="tm-time">0:10</div><div class="muted" id="tm-round">Раунд 0 из ${v.rounds}</div>
    <div class="row" style="justify-content:center"><button class="btn primary big" data-act="iv-toggle">${v.st.run?'Пауза':run?'Продолжить':'Старт'}</button><button class="btn big ghost" data-act="iv-reset">Сброс</button></div>
    <div class="fields" style="width:100%;max-width:560px">${[['work','Работа, с'],['rest','Отдых, с'],['rounds','Раунды'],['prep','Подготовка, с']].map(([k,l])=>`<div class="field"><label for="iv-${k}">${l}</label><input class="input" id="iv-${k}" data-iv="${k}" type="number" min="${k==='rounds'?1:0}" value="${v[k]}" ${run?'disabled':''}></div>`).join('')}</div>
    <div class="row" style="justify-content:center"><span class="small muted">Всего ${fmtDur(tot)} ·</span><button class="chip" data-act="iv-preset" data-v="20,10,8">Табата 20/10 × 8</button><button class="chip" data-act="iv-preset" data-v="40,20,10">40/20 × 10</button><button class="chip" data-act="iv-preset" data-v="60,30,6">60/30 × 6</button></div>`}
  if(m==='rest'){face=`${ring('tm-ring','rest')}<div class="row" style="justify-content:center">${[30,45,60,90,120,180].map(s=>`<button class="chip ${T.rs.dur===s?'on':''}" data-act="rs-set" data-v="${s}">${s<60?s+' с':s/60+' мин'}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn primary big" data-act="rs-toggle">${T.rs.run?'Пауза':'Старт'}</button><button class="btn big" data-act="rs-add" data-v="15">+15 с</button><button class="btn big ghost" data-act="rs-reset">Сброс</button></div>`}
  if(m==='stopwatch'){face=`<div class="countdown" id="tm-sw">0:00.0</div><div class="row" style="justify-content:center"><button class="btn primary big" data-act="sw-toggle">${T.sw.run?'Пауза':'Старт'}</button><button class="btn big" data-act="sw-lap" ${T.sw.run?'':'disabled'}>Круг</button><button class="btn big ghost" data-act="sw-reset">Сброс</button></div><ol class="laps" id="sw-laps"></ol>`}
  if(m==='run'){const r=T.run;face=`<div class="grid g2" style="width:100%;max-width:420px"><div class="stat"><span class="eyebrow">Время</span><span class="v num" id="tm-run-time" style="font-size:32px">0:00</span></div><div class="stat"><span class="eyebrow">Дистанция, ${r.unit==='km'?'км':'мили'}</span><span class="v num" id="tm-run-dist" style="font-size:32px">0.00</span></div></div>
    <div class="row" style="justify-content:center"><span class="small muted">Темп: <b class="mono" id="tm-run-pace">—</b></span></div>
    <div class="row" style="justify-content:center"><button class="btn primary big" data-act="run-toggle">${r.running?'Пауза':(r.acc?'Продолжить':'Старт')}</button><button class="btn big" data-act="run-lap" ${r.running?'':'disabled'}>+ 1 ${r.unit==='km'?'км':'миля'}</button><button class="btn big ghost" data-act="run-reset">Сброс</button></div>
    <div class="seg">${[['km','Километры'],['mi','Мили']].map(([k,n])=>`<button data-act="run-unit" data-v="${k}" aria-pressed="${r.unit===k}">${n}</button>`).join('')}</div>
    <p class="small muted" style="max-width:60ch">Нажимайте «+1 ${r.unit==='km'?'км':'миля'}» на каждой отметке дистанции — так же, как на разметке парка или беговой дорожке. Приложение посчитает темп сама.</p>`}
  return header('Таймер','Раунды · интервалы · отдых · секундомер · калькуляторы')+
  `<div class="seg" role="group" aria-label="Режим">${[['rounds','Раунды'],['interval','Интервалы'],['rest','Отдых'],['stopwatch','Секундомер'],['run','Пробежка'],['tools','Калькуляторы']].map(([k,n])=>`<button data-act="tmode" data-v="${k}" aria-pressed="${m===k}">${n}</button>`).join('')}</div>
  ${m==='tools'?vTools():`<section class="panel lift timer-face">${face}</section>
  <p class="small muted" style="max-width:65ch">Гонг звучит в начале и конце раунда, короткие сигналы — за 3 секунды до смены. ${S.settings.voice?'Голос называет раунды и комбинации.':'Голосовые подсказки выключены в профиле.'} Пока таймер идёт, экран не гаснет (если телефон это разрешает).</p>`}`;
}
/* ---------- калькуляторы: 1ПМ, уровень силы, блины ---------- */
function e1rm(w,r){if(!(w>0)||!(r>0))return 0;if(r===1)return w;return(w*(1+r/30)+w*36/(37-Math.min(r,36)))/2}
function calcS(){return ui.calc||(ui.calc={w:80,r:5,lift:'bbBench',kg:100,bar:S.settings.bar||20,bw:(lastW()||{}).w||75,wk:100,wr:5})}
function rmHTML(){const c=calcS(),m=e1rm(c.w,c.r),R=[[100,1],[95,2],[90,4],[85,6],[80,8],[75,10],[70,12],[65,15],[60,18],[50,25]];
  if(!m)return '<p class="small muted">Введите вес и число повторов.</p>';
  return `<div class="stat"><span class="eyebrow">Максимум на один раз</span><span class="v">≈ ${fmt(m,1)}<small>кг</small></span></div>
    <div class="tablewrap"><table class="t"><thead><tr><th>% от 1ПМ</th><th>Вес</th><th>≈ повторов</th></tr></thead><tbody>${R.map(([p,r])=>`<tr><td>${p}%</td><td class="n">${fmt(Math.round(m*p/100/2.5)*2.5,1)} кг</td><td class="n">${r}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Среднее формул Эпли и Бжицки. Точнее всего по подходу на 3–10 повторов.</p>`}
function bestE1(id){let b=0;exHistory(id).forEach(h=>{if(h.e1>b)b=h.e1});return b}
function lvlHTML(){const c=calcS(),sd=STR_STD[c.lift],bw=c.bw||75,hist=bestE1(c.lift),m=hist||e1rm(c.w,c.r),std=S.profile.sex==='f'?sd.f:sd.m,ratio=m/bw;
  let i=-1;std.forEach((t,k)=>{if(ratio>=t)i=k});const next=std[i+1];
  return `<div class="stat"><span class="eyebrow">${hist?'По вашей истории':'По калькулятору 1ПМ'}: ${fmt(m,1)} кг · ×${fmt(ratio,2)} веса тела</span><span class="v" style="font-size:26px">${i<0?'Ниже уровня «Новичок»':STR_LV[i]}</span></div>
    <div class="lvlbar">${std.map((t,k)=>`<span class="${k<=i?'on':''}"><b>${STR_LV[k]}</b><small>${fmt(t*bw,0)} кг</small></span>`).join('')}</div>
    <p class="small muted">${next?`До уровня «${STR_LV[i+1]}» — ${fmt(Math.max(0,next*bw-m),1)} кг к максимуму.`:'Это уровень элиты — дальше только соревнования.'} Нормативы ориентировочные, по распространённым таблицам для ${S.profile.sex==='f'?'женщин':'мужчин'}.</p>`}
function platesHTML(){const c=calcS(),p=platesOf(c.kg,c.bar);if(!p)return '<p class="small muted">Вес меньше грифа.</p>';
  const col={25:'#C0392B',20:'#2E5FBF',15:'#D9A400',10:'#2E8B57',5:'#EEE',2.5:'#555',1.25:'#999'};
  return `<div class="plates" aria-hidden="true"><i class="grip"></i>${p.out.map(x=>`<i style="height:${30+x*2.6}px;background:${col[x]}"></i>`).join('')}<i class="sleeve"></i></div>
    <p><b>${platesTxt(c.kg,c.bar)}</b></p><p class="small muted">Всего на штанге: ${kgS(c.kg-p.rest)} кг. Блины 25 · 20 · 15 · 10 · 5 · 2,5 · 1,25 кг.</p>`}
function warmHTML(){const c=calcS(),wk=c.wk||0,bar=c.bar||20;if(!(wk>bar))return '<p class="small muted">Введите рабочий вес больше веса грифа.</p>';
  const R=[[0,10,'Пустой гриф'],[.4,5,'40%'],[.6,3,'60%'],[.8,2,'80%'],[.9,1,'90% — только для тяжёлых сетов на 1–3 повтора']].filter(([p],i)=>i<4||c.wr<=3);
  const rows=R.map(([p,r,l])=>{const kg=p?Math.max(bar,Math.round(wk*p/2.5)*2.5):bar;return `<tr><td>${l}</td><td class="n">${kgS(kg)} кг × ${r}</td><td class="small muted">${p?platesTxt(kg,bar).replace('На каждую сторону: ',''):'—'}</td></tr>`}).join('');
  return `<div class="tablewrap"><table class="t"><thead><tr><th>Подход</th><th>Вес × повторы</th><th>Блины на сторону</th></tr></thead><tbody>${rows}<tr><td><b>Рабочий</b></td><td class="n"><b>${kgS(wk)} кг × ${c.wr||5}</b></td><td class="small muted">${platesTxt(wk,bar).replace('На каждую сторону: ','')}</td></tr></tbody></table></div>
    <p class="small muted">Разминочные подходы лёгкие, без отказа, отдых 1–2 минуты. Они разогревают суставы и «настраивают» технику, не утомляя мышцы.</p>`}
function vTools(){const c=calcS();
  return `<section class="grid g2 tools"><div class="panel lift"><h3>Расчётный максимум (1ПМ)</h3>
      <div class="fields"><div class="field"><label for="c-w">Вес, кг</label><input class="input" id="c-w" data-calc="w" type="number" inputmode="decimal" value="${c.w}"></div><div class="field"><label for="c-r">Повторы</label><input class="input" id="c-r" data-calc="r" type="number" inputmode="numeric" value="${c.r}"></div></div>
      <div id="calc-1rm" class="stack">${rmHTML()}</div></div>
    <div class="panel lift"><h3>Уровень силы</h3>
      <div class="fields"><div class="field"><label for="c-lift">Упражнение</label><select class="input" id="c-lift" data-calc="lift">${Object.entries(STR_STD).map(([k,v])=>`<option value="${k}" ${c.lift===k?'selected':''}>${v.n}</option>`).join('')}</select></div><div class="field"><label for="c-bw">Ваш вес, кг</label><input class="input" id="c-bw" data-calc="bw" type="number" inputmode="decimal" value="${c.bw}"></div></div>
      <div id="calc-lvl" class="stack">${lvlHTML()}</div></div>
    <div class="panel lift"><h3>Блины на гриф</h3>
      <div class="fields"><div class="field"><label for="c-kg">Вес на штанге, кг</label><input class="input" id="c-kg" data-calc="kg" type="number" inputmode="decimal" step="2.5" value="${c.kg}"></div><div class="field"><label for="c-bar">Гриф</label><select class="input" id="c-bar" data-calc="bar">${[20,15,10].map(b=>`<option value="${b}" ${c.bar===b?'selected':''}>${b} кг</option>`).join('')}</select></div></div>
      <div id="calc-plates" class="stack">${platesHTML()}</div></div>
    <div class="panel lift"><h3>Разминка перед рабочим весом</h3>
      <div class="fields"><div class="field"><label for="c-wk">Рабочий вес, кг</label><input class="input" id="c-wk" data-calc="wk" type="number" inputmode="decimal" step="2.5" value="${c.wk}"></div><div class="field"><label for="c-wr">Повторов в рабочем</label><input class="input" id="c-wr" data-calc="wr" type="number" inputmode="numeric" value="${c.wr}"></div></div>
      <div id="calc-warm" class="stack">${warmHTML()}</div></div></section>`}
function swNow(){return T.sw.acc+(T.sw.run?Date.now()-T.sw.start:0)}
function fmtSw(ms){return fmtDur(Math.floor(ms/1000))+'.'+Math.floor(ms%1000/100)}
function paintSeg(cfg,segs,now,label){
  const st=segState(cfg,segs,now),ph=document.getElementById('tm-phase');if(!ph)return;
  if(st.done){ph.className='phase';ph.textContent='Готово';document.getElementById('tm-time').textContent='0:00';document.getElementById('tm-round').textContent='Все раунды пройдены';return}
  ph.className='phase '+st.seg.k;ph.textContent={prep:'Готовность',work:label,rest:'Отдых'}[st.seg.k];
  document.getElementById('tm-time').textContent=fmtDur(Math.ceil(st.left/1000));
  document.getElementById('tm-round').textContent=`Раунд ${st.seg.r||0} из ${cfg.rounds}`;
  const cb=document.getElementById('tm-combo');if(cb)cb.textContent=cfg.st.run&&st.seg.k==='work'?T.cb.text:'';
}
function timerPaint(){
  const now=Date.now();
  if(T.mode==='rounds')paintSeg(T.rd,segsRd(),now,'Бой');
  if(T.mode==='interval')paintSeg(T.iv,segsIv(),now,'Работа');
  const sw=document.getElementById('tm-sw');if(sw){sw.textContent=fmtSw(swNow());const l=document.getElementById('sw-laps');if(l&&l.childElementCount!==T.sw.laps.length)l.innerHTML=T.sw.laps.map((x,i)=>`<li><span>Круг ${i+1}</span><span>${fmtSw(x-(T.sw.laps[i-1]||0))}</span><span class="muted">${fmtSw(x)}</span></li>`).reverse().join('')}
  const rt=document.getElementById('tm-run-time');if(rt){const r=T.run,el=(r.acc+(r.running?now-r.start:0))/1000;rt.textContent=fmtDur(el);const dd=document.getElementById('tm-run-dist');if(dd)dd.textContent=fmt(r.dist,2);const pc=document.getElementById('tm-run-pace');if(pc)pc.textContent=r.dist>0?fmtDur(el/r.dist)+' /'+(r.unit==='km'?'км':'ми'):'—'}
  if(document.getElementById('tm-ring')){const left=T.rs.run?Math.max(0,T.rs.end-now):T.rs.left;setRing('tm-ring',left/(T.rs.dur*1000),fmtDur(Math.ceil(left/1000)),T.rs.run?'отдых':'')}
}
function comboTick(now,type){if(now<T.cb.next)return;T.cb.text=rand(COMBOS[type]||COMBOS.box);T.cb.next=now+3200+Math.random()*2600;say(comboSpeech(T.cb.text))}
const NUMW={'1':'раз','2':'два','3':'три','4':'четыре','5':'пять','6':'шесть'};
const comboSpeech=t=>t.replace(/\d/g,d=>NUMW[d]+' ').replace(/[—-]/g,' ').replace(/\s+/g,' ');
function segTick(cfg,segs,now,kind){
  const st=cfg.st;if(!st.run)return;const s=segState(cfg,segs,now);
  if(s.done){st.run=false;st.acc=0;st.last=-1;bell(3);say('Конец. Отличная работа');wake();if(ui.tab==='timer')render();return}
  if(s.i!==st.last){if(s.seg.k==='work'){bell(1);say(kind==='rd'?'Раунд '+s.seg.r:'Работа')}else if(s.seg.k==='rest'){bell(2);say('Отдых')}st.last=s.i;T.cb.next=now+1500;T.cb.text=''}
  const sec=Math.ceil(s.left/1000);
  if(kind==='rd'&&cfg.warn&&s.seg.k==='work'&&sec===10&&cfg.round>20&&st.b!==s.i+':10'){st.b=s.i+':10';clap()}
  if(sec<=3&&sec>0&&st.b!==s.i+':'+sec){st.b=s.i+':'+sec;beep(660,.08)}
  if(kind==='rd'&&cfg.combo!=='off'&&s.seg.k==='work')comboTick(now,cfg.combo);
}
function timerTick(now){
  segTick(T.rd,segsRd(),now,'rd');segTick(T.iv,segsIv(),now,'iv');
  if(T.rs.run){const left=T.rs.end-now,s=Math.ceil(left/1000);if(s<=3&&s>0&&T.rs.b!==s){T.rs.b=s;beep(660,.1)}if(left<=0){T.rs.run=false;T.rs.left=T.rs.dur*1000;bell(1);buzz([200,100,200]);say('Отдых окончен');wake();if(ui.tab==='timer')render()}}
}

function musVol(days){const from=addDays(todayKey(),-(days-1));return musVolW(S.workouts.filter(w=>w.d>=from))}

let PL=null;
/* незавершённая тренировка переживает выгрузку приложения из памяти */
const PL_KEY='podhod:pl';
function plSave(){if(!PL||PL.phase==='intro'||PL.phase==='done')return;try{localStorage.setItem(PL_KEY,JSON.stringify({v:1,at:Date.now(),w:PL.w,planId:PL.planId||null,start:PL.start,k:PL.k,log:PL.log,steps:PL.steps,capEnd:PL.capEnd||0,planned0:PL.planned0,rk0:PL.rk0,paused:PL.paused||0}))}catch(e){}}
function plClear(){try{localStorage.removeItem(PL_KEY)}catch(e){}}
function plPending(){try{const d=JSON.parse(localStorage.getItem(PL_KEY)||'null');if(!d||!d.w||!(Date.now()-d.at<36*3600e3))return null;return d}catch(e){return null}}
function plResumeCard(){if(PL)return '';const d=plPending();if(!d)return '';const n=(Array.isArray(d.log)?d.log:[]).reduce((a,e)=>a+(e&&Array.isArray(e.sets)?e.sets.length:0),0);
  return `<section class="panel camp-mini"><div class="row between"><span class="eyebrow">Незавершённая тренировка</span><span class="small muted">${fmtD(dkey(new Date(+d.start||+d.at)),{day:'numeric',month:'short'})} · ${n} ${plural(n,'подход','подхода','подходов')}</span></div>
    <h3>${esc(str(d.w.title,120))}</h3><p class="small muted">Приложение закрылось во время тренировки. Сделанные подходы сохранены — можно продолжить с того же места.</p>
    <div class="row"><button class="btn primary" data-act="pl-resume">${ic('play',16)} Продолжить</button><button class="btn" data-act="pl-savepart">Сохранить как есть</button><button class="btn ghost" data-act="pl-discard">Удалить</button></div></section>`}
function plResume(){const d=plPending();if(!d)return false;const w=normW(d.w);if(!w){plClear();return false}
  let steps=Array.isArray(d.steps)?d.steps.filter(x=>x&&Number.isInteger(x.i)&&x.i>=0&&x.i<w.items.length).map(x=>{const o={i:x.i,s:Math.round(numIn(x.s,0,500)||0),rest:Math.round(numIn(x.rest,0,1200)||0)};
    ['time','reps','ramp','pct'].forEach(k=>{const v=numIn(x[k],0,7200);if(v!=null)o[k]=Math.round(v)});['wu','drop','fail','emom'].forEach(k=>{if(x[k])o[k]=1});return o}):[];
  if(!steps.length)steps=buildSteps(w);
  const log=w.items.map((it,i)=>{const l=Array.isArray(d.log)&&d.log[i];return{id:it.ex,sets:l&&Array.isArray(l.sets)?l.sets.map(normSet):[]}});
  startWorkout(w,typeof d.planId==='string'?d.planId:null,{resume:{start:numIn(d.start,0,4e12)||Date.now(),at:numIn(d.at,0,4e12)||Date.now(),k:clamp(Math.round(numIn(d.k,0,1e4)||0),0,steps.length-1),log,steps,capEnd:numIn(d.capEnd,0,4e12)||0,planned0:numIn(d.planned0,0,1e4),rk0:numIn(d.rk0,0,50)}});return true}
function startWorkout(w,planId,o={}){
  ensureAudio();closeFull();
  w=JSON.parse(JSON.stringify(w));
  if(!o.resume&&eclArmed()&&!w.ecl&&w.kind!=='cooldown')applyEclipse(w);
  const sug=w.items.map(it=>{if(it.wu||w.noprog)return null;

function tick(){

  if(PL&&PL.phase!=='done'&&PL.phase!=='intro'){
    const e=document.getElementById('pl-elapsed');if(e)e.textContent=fmtDur((now-PL.start)/1000);
    if(PL.capEnd){const c=document.getElementById('pl-cap');if(c)c.textContent=fmtDur((PL.capEnd-now)/1000);const b=document.getElementById('pl-bar');if(b)b.style.width=(clamp((now-(PL.capEnd-PL.w.cap*1000))/(PL.w.cap*1000),0,1)*100).toFixed(1)+'%';
      if(now>=PL.capEnd){bell(3);say('Время вышло');finishWorkout();return}}
    const st=curStep();if(PL.paused)return;
    if(PL.phase==='rest'){const left=PL.restEnd-now,s=Math.ceil(left/1000);setRing('pl-ring',left/(PL.restDur*1000),fmtDur(s),'из '+fmtDur(PL.restDur));
      if(s===5&&PL.beep!=='n'&&PL.restDur>=20){PL.beep='n';say(coach('ready')+' '+EX[PL.items[st.i].ex].name)}
      if(s<=3&&s>0&&PL.beep!==s){PL.beep=s;beep(660,.1)}
      if(left<=0){buzz([200]);startStep(true)}}
    if(PL.phase==='timed'){const it=PL.items[st.i],left=PL.timedEnd-now,s=Math.ceil(left/1000);const c=document.getElementById('pl-count');if(c){c.textContent=fmtDur(s);if(s<=3&&s>0&&c.dataset.hot!=String(s)){c.dataset.hot=s;c.classList.remove('hot');void c.offsetWidth;c.classList.add('hot')}}

      if(s<=3&&s>0&&PL.beep!==s){PL.beep=s;beep(660,.1)}if(left<=0){bell(1);buzz([200]);logSet({t:st.time})}}
  }

}

  'pl-step':v=>{const[id,d]=v.split(':'),el=document.getElementById(id);let st=+d;if(id==='p-kg'){const s0=curStep(),x=s0&&PL.items[s0.i].ex,cur=parseFloat(el.value)||0;st=(+d>0?1:-1)*(x?(kgStep(x,cur)||4):2.5)}el.value=clamp(r1((parseFloat(el.value)||0)+st),0,id==='p-kg'?1000:500);const pp=document.getElementById('p-plates');if(pp&&id==='p-kg')pp.textContent=platesTxt(parseFloat(el.value)||0)},

  ask(`Заменить текущие записи данными из файла?${ph&&ph.length?' Фото прогресса тоже заменятся ('+ph.length+').':' Фото на этом устройстве останутся.'}`,'Заменить',()=>{let ns;
    try{ns=merge({main:{profile:st.profile,weights:st.weights,settings:st.settings,customFoods:st.customFoods,favFoods:st.favFoods,foodSets:st.foodSets,plan:null,week:null,camp:st.camp,ecl:st.ecl,prog:st.prog,track:st.track,notes:st.notes,customEx:st.customEx,routines:st.routines},'m-import':{workouts:st.workouts,food:st.food,water:st.water}})}catch(e){toast('Файл повреждён — данные не загружены');return}
    const old=Object.keys(split());S=ns;S.demo=false;new Set([...old,...store.known,...Object.keys(split())]).forEach(k=>touch(k));
