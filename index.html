<!doctype html>
<html lang="ru" data-skin="berserk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0909">
<meta name="description" content="Дневник тренировок: программы по уровням, техника с фото, таймеры, питание, вес и отчёты.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Подход">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Подход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Cormorant:ital,wght@1,600&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ECEEE9; --surface:#FFFFFF; --surface2:#F4F5F1; --ink:#14181E; --muted:#5B636D; --line:#D6DAD2;
  --accent:#2446C8; --accent-soft:#E2E7FA; --on-accent:#FFFFFF;
  --plate-g:#2E8B57; --plate-y:#D9A400; --plate-r:#D0352A; --plate-ink-y:#231A00;
  --good:#2B8453; --warn:#B87D00; --bad:#C3352B;
  --shadow:0 1px 2px rgba(20,24,30,.05),0 10px 30px rgba(20,24,30,.07);
  --r:14px; --r-img:12px; --photo-filter:none;
  --f-display:'Oswald','Arial Narrow',sans-serif; --f-num:'Oswald','Arial Narrow',sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --f-quote:'Manrope',system-ui,sans-serif; --h-weight:600; --h-track:.01em;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1014; --surface:#161A20; --surface2:#1C2129; --ink:#E7EAEE; --muted:#96A0AB; --line:#29303A;
    --accent:#7B92FF; --accent-soft:#1E2646; --on-accent:#0B0E14;
    --plate-g:#3DAA6E; --plate-y:#E3B524; --plate-r:#E2554A;
    --good:#4CC07F; --warn:#E3B524; --bad:#EF6B60; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#161A20; --surface2:#1C2129; --ink:#E7EAEE; --muted:#96A0AB; --line:#29303A;
  --accent:#7B92FF; --accent-soft:#1E2646; --on-accent:#0B0E14;
  --plate-g:#3DAA6E; --plate-y:#E3B524; --plate-r:#E2554A;
  --good:#4CC07F; --warn:#E3B524; --bad:#EF6B60; --shadow:0 10px 30px rgba(0,0,0,.35);
}
/* ---------- Берсерк ---------- */
:root[data-skin="berserk"]{
  --bg:#0A0909; --surface:#131111; --surface2:#1B1817; --ink:#E8DFD2; --muted:#978C81; --line:#2E2826;
  --accent:#B3161C; --accent-soft:#2A1112; --on-accent:#F6EEE4;
  --plate-g:#6E737A; --plate-y:#9A6A2F; --plate-r:#C21A20; --plate-ink-y:#F6EEE4;
  --good:#93A96C; --warn:#C8904A; --bad:#E0474B; --shadow:0 18px 40px rgba(0,0,0,.55);
  --r:4px; --r-img:3px; --photo-filter:grayscale(1) contrast(1.28) brightness(.82);
  --f-display:'Cormorant SC','Cormorant',Georgia,serif; --h-weight:700; --h-track:.05em; --f-quote:'Cormorant','Cormorant SC',Georgia,serif;
  color-scheme:dark;
}
/* ---------- Рокки ---------- */
:root[data-skin="rocky"]{
  --bg:#D3CFC7; --surface:#EEEBE5; --surface2:#E2DED6; --ink:#16161A; --muted:#57554F; --line:#B6B1A7;
  --accent:#B5121B; --accent-soft:#F0D5D1; --on-accent:#FFFFFF;
  --plate-g:#1F3A6B; --plate-y:#C99A1E; --plate-r:#B5121B; --plate-ink-y:#16161A;
  --good:#2D6A3E; --warn:#9A6800; --bad:#B5121B; --shadow:4px 4px 0 #16161A;
  --r:6px; --r-img:4px; --photo-filter:sepia(.38) saturate(.85) contrast(1.08);
  --f-display:'Oswald','Arial Narrow',sans-serif; --h-weight:700; --h-track:.02em; --f-quote:'Oswald','Arial Narrow',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font:var(--h-weight) clamp(28px,5.4vw,42px)/1.02 var(--f-display);text-transform:uppercase;letter-spacing:var(--h-track);text-wrap:balance}
h2{font:var(--h-weight) 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:var(--h-track);text-wrap:balance}
h3{font:700 15px/1.3 var(--f-body)}
.eyebrow{font:700 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
main{width:100%;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:20px;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .brand,.nav .n-profile{display:none}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:700}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr}
  .nav{position:sticky;top:0;height:100vh;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:22px 14px}
  .nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;font:var(--h-weight) 26px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:none;border:0;cursor:pointer}
  .nav .n-profile{display:flex}
  .nav button{flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;justify-content:flex-start}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  main{padding-block:28px 60px;padding-inline:32px}
}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top .who{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
@media (min-width:900px){.top .who{display:none}}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.lift{box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--r) - 2px);padding:10px 16px;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:15px 22px;font-size:16px}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:38px;height:38px;padding:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:3px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:none;padding:7px 12px;border-radius:calc(var(--r) - 5px);font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.good{color:var(--good);border-color:currentColor;background:transparent}
button.chip{cursor:pointer}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.plate{width:18px;height:18px;border-radius:50%;flex:none;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14);display:inline-block}
.plate::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.plate.g{background:var(--plate-g)} .plate.y{background:var(--plate-y)} .plate.r{background:var(--plate-r)}
.plate.xl{width:54px;height:54px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.14),inset 0 0 0 9px rgba(255,255,255,.12)}
.plate.xl::after{inset:19px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:700;color:var(--muted)}
.input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:calc(var(--r) - 4px);padding:10px 12px;font-size:15px;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.switch input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);border:1px dashed var(--accent)}
.banner p{max-width:65ch}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .v{font:600 30px/1 var(--f-num);font-variant-numeric:tabular-nums}
.stat .v small{font:600 14px var(--f-body);color:var(--muted);margin-left:4px}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)}

/* photos */
.ph{position:relative;aspect-ratio:3/2;width:100%;border-radius:var(--r-img);overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:var(--photo-filter);animation:phzoom 6s ease-in-out infinite alternate}
.ph img.b{animation:phzoomB 6s ease-in-out infinite alternate,phb 3.2s cubic-bezier(.6,0,.4,1) infinite}
.ph img.a{animation:phzoom 6s ease-in-out infinite alternate,pha 3.2s cubic-bezier(.6,0,.4,1) infinite}
.ph .tag.b{animation:phb 3.2s cubic-bezier(.6,0,.4,1) infinite}
.ph .tag.a{animation:pha 3.2s cubic-bezier(.6,0,.4,1) infinite}
.ph.one .tag{animation:none}
.ph .tag{position:absolute;left:8px;bottom:8px;font:800 10px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:rgba(8,8,10,.78);color:#fff;z-index:2}
.ph.sm .tag{display:none}
.ph .scrub{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22);z-index:2}
.ph.sm .scrub,.ph.one .scrub{display:none}
.ph .scrub i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;animation:scrub 3.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes phb{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes pha{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes phzoom{0%{transform:scale(1)}100%{transform:scale(1.055)}}
@keyframes phzoomB{0%{transform:scale(1.055)}100%{transform:scale(1)}}
@keyframes scrub{0%{transform:scaleX(0)}92%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.ph img{animation:none!important}.ph img.b,.ph .tag.b{opacity:0}.ph .tag.a{opacity:1}.ph .scrub{display:none}}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frames.one{grid-template-columns:1fr}
.frames figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.frames img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--r-img);display:block;filter:var(--photo-filter);border:1px solid var(--line)}
.frames figcaption{font-size:12px;font-weight:700;color:var(--muted)}
.thumb{width:72px;flex:none}
.vbadge{position:absolute;right:8px;top:8px;z-index:2;display:inline-flex;align-items:center;gap:4px;font:800 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--accent);color:var(--on-accent)}
.ph.sm .vbadge{display:none}
.vidwrap{display:flex;flex-direction:column;gap:8px}
.vidwrap video{width:100%;border-radius:var(--r-img);border:1px solid var(--line);background:#000;display:block;aspect-ratio:4/3;object-fit:contain}
.vidmore summary::-webkit-details-marker{display:none}
.pthumb{display:flex;flex-direction:column;gap:6px;background:none;border:1px solid var(--line);border-radius:var(--r);padding:6px;text-align:center;font:inherit;color:var(--ink)}
.pthumb:hover{border-color:var(--accent)}
.pthumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:calc(var(--r-img) - 2px);display:block;background:var(--surface2)}
.pthumb span{font-size:11px;color:var(--muted);font-weight:700}
.pcompare{position:relative;width:100%;aspect-ratio:3/4;max-width:420px;margin:0 auto;border-radius:var(--r-img);overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.pcompare>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcompare .after{position:absolute;inset:0;overflow:hidden;clip-path:inset(0 0 0 50%)}
.pcompare .after img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc-line{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);pointer-events:none;transform:translateX(-50%)}
.pc-line::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;background:#fff;color:#111;border-radius:50%;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#pc-slider{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none}
.pc-tag{position:absolute;bottom:8px;font:800 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:rgba(8,8,10,.72);color:#fff}
.pc-tag.a{left:8px}.pc-tag.b{right:8px}

/* quote */
.quote{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;margin:0}
.quote .qm{font:700 64px/.8 var(--f-display);color:var(--accent);margin-top:4px}
.quote blockquote{margin:0;font:600 clamp(19px,3.4vw,24px)/1.3 var(--f-quote);text-wrap:balance;max-width:42ch}
.quote.center{grid-template-columns:1fr;justify-items:center;text-align:center}
.quote.center .qm{display:none}
.quote.joke blockquote{font-size:16px;font-family:var(--f-body);font-style:normal;text-transform:none;color:var(--muted)}
.mark{width:22px;height:22px;flex:none;display:inline-grid;place-items:center}
.deco{display:none}

/* rank */
.rank{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.rank .badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 20px/1 var(--f-num);background:var(--accent);color:var(--on-accent);box-shadow:inset 0 0 0 4px rgba(0,0,0,.18)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ladder li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.ladder li.cur{color:var(--accent);font-weight:800}
.ladder li.fut{color:var(--muted)}

/* today & builder */
.hero{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:820px){.hero{grid-template-columns:1.25fr 1fr}}
.exrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exrows li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exrows li:last-child{border-bottom:0}
.exrows .nm{flex:1;min-width:0}
.exrows .nm button{background:none;border:0;padding:0;text-align:left;font-weight:700;color:var(--ink)}
.exrows .nm button:hover{color:var(--accent)}
.exrows .sr{font-family:var(--f-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.exrows .nm button{overflow-wrap:anywhere}
.places{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.place{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2);min-width:0}
.place b{font:var(--h-weight) 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:var(--h-track)}
.place small{color:var(--muted);font-size:11px;line-height:1.3}
.place[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
@media (max-width:480px){.place small{display:none}}
.ai-box{border:1px dashed var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);border-radius:calc(var(--r) - 4px);padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;background:var(--surface);min-width:0}
.day .d{font:600 18px/1 var(--f-num)}
.day .w{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .mk{width:8px;height:8px;border-radius:50%;background:var(--line)}
.day .mk.plan{background:transparent;box-shadow:inset 0 0 0 2px var(--muted)}
.day .mk.done{background:var(--good)}

/* library */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.excard:hover{border-color:var(--accent)}
.excard .meta{display:flex;justify-content:space-between;gap:8px;align-items:center}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:760px){.modal{align-items:center;padding:24px}.sheet{border-radius:calc(var(--r) + 4px)}}
.sheet.narrow{max-width:420px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 13px/1 var(--f-mono)}
ul.warn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.warn li{padding-left:18px;position:relative}
ul.warn li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--bad);transform:rotate(45deg)}

/* player */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.pl{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pl-top .ttl{text-align:center;min-width:0}
.pl-prog{display:flex;gap:4px}
.pl-prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.pl-prog i.done{background:var(--good)} .pl-prog i.cur{background:var(--accent)}
.pl-main{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:760px){.pl-main{grid-template-columns:1fr 1fr;align-items:start}}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:calc(var(--r) - 2px);background:var(--surface);overflow:hidden}
.stepper button{border:0;background:none;width:48px;height:54px;font-size:24px;font-weight:700;color:var(--muted);flex:none}
.stepper button:hover{background:var(--surface2);color:var(--ink)}
.stepper input{width:100%;min-width:0;border:0;background:none;text-align:center;font:600 28px/1 var(--f-num);font-variant-numeric:tabular-nums;padding:0}
.stepper input:focus{outline:none}
.setlog{display:flex;flex-wrap:wrap;gap:6px}
.setlog span{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.ringwrap{position:relative;width:min(260px,68vw);margin:0 auto}
.ringwrap svg{width:100%;height:auto;display:block;transform:rotate(-90deg)}
.ringwrap .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringwrap .rv b{font:600 clamp(48px,14vw,72px)/1 var(--f-num);font-variant-numeric:tabular-nums;display:block}
.ring-bg{fill:none;stroke:var(--line)}
.ring-fg{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring-fg.rest{stroke:var(--good)} .ring-fg.over{stroke:var(--bad)}
.countdown{font:600 clamp(64px,18vw,112px)/1 var(--f-num);font-variant-numeric:tabular-nums;text-align:center}
.combo{font:var(--h-weight) clamp(30px,8vw,52px)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:var(--h-track);text-align:center;color:var(--accent);min-height:1.1em;text-wrap:balance}
.combo-legend{font-size:12px;color:var(--muted);text-align:center}
.intro{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}

/* timer */
.timer-face{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:10px}
.phase{font:800 13px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;padding:7px 14px;border-radius:99px;background:var(--surface2)}
.phase.work{background:var(--plate-r);color:#fff}
.phase.rest{background:var(--plate-g);color:#fff}
.phase.prep{background:var(--plate-y);color:var(--plate-ink-y)}
.laps{list-style:none;margin:0;padding:0;width:100%;max-width:360px}
.laps li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:14px}

/* food */
.macro{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:480px){.macro{grid-template-columns:1fr;justify-items:center}}
.mbars{display:flex;flex-direction:column;gap:12px;width:100%}
.fitem{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fitem .nm{min-width:0;overflow-wrap:anywhere}
.fitem .kc{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.results{display:flex;flex-direction:column;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:calc(var(--r) - 4px)}
.results button{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px;text-align:left}
.results button:last-child{border-bottom:0}
.results button:hover,.results button[aria-pressed="true"]{background:var(--accent-soft)}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:26px;height:34px;border:2px solid var(--line);border-radius:3px 3px 8px 8px;background:none;padding:0}
.glass.full{border-color:var(--accent);background:linear-gradient(to top,var(--accent) 78%,transparent 78%)}

/* charts, tables */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:300px;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface));border-color:transparent}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface));border-color:transparent}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--surface));border-color:transparent}
.heat i.l4{background:var(--accent);border-color:transparent}
.heat i.fut{opacity:.3}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.tablewrap{overflow-x:auto}
.hist>details{border-top:1px solid var(--line)}
.hist summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hist .dt{font:600 20px/1 var(--f-num);width:44px;text-align:center}
.hist .dt small{display:block;font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.hist .body{padding:0 0 14px 56px;display:flex;flex-direction:column;gap:6px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.ach div{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ach div.no{opacity:.45}
.ach b{display:block;font-size:13px}
.ach small{color:var(--muted);font-size:12px}
.skins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.skin-opt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.skin-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.skin-opt small{color:var(--muted);font-size:12px}
.sw{width:100%;height:34px;border-radius:4px;border:1px solid rgba(128,128,128,.3)}
.sw-classic{background:linear-gradient(90deg,#ECEEE9 0 50%,#2446C8 50% 75%,#14181E 75%)}
.sw-berserk{background:radial-gradient(circle at 70% 50%,#0A0909 0 7px,#B3161C 8px 10px,transparent 11px),linear-gradient(90deg,#0A0909,#1B1817 60%,#2E2826)}
.sw-rocky{background:linear-gradient(180deg,#B5121B 0 33%,#EDEAE4 33% 66%,#1F3A6B 66%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:24px}}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.2) 0 12%,rgba(179,22,28,.55) 13% 16%,rgba(0,0,0,.85) 40%);animation:fl 1.6s ease-out forwards}
@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* eclipse: солнечное затмение на чистом CSS/SVG, работает на телефоне без библиотек */
.eclipse{position:relative;width:100%;overflow:hidden;background:#050403}
.eclipse svg{display:block;width:100%;height:100%}
.eclipse .sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0),rgba(0,0,0,.94));animation:eclSky 7s ease-in-out infinite}
.eclipse .stars{position:absolute;inset:0;animation:eclStars 7s ease-in-out infinite}
.eclipse .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 3px 1px rgba(255,255,255,.8)}
.eclipse .corona{filter:drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 16px var(--accent));animation:eclGlow 7s ease-in-out infinite}
.eclipse .moon-g{animation:eclMoon 7s linear infinite}
.eclipse .cap{position:absolute;left:10px;bottom:8px;font:800 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:4px;background:rgba(5,4,3,.7);color:#F0C77A;z-index:2}
.eclipse.mini{aspect-ratio:16/9;border-radius:var(--r-img);border:1px solid var(--line)}
.eclipse.hero{aspect-ratio:5/3}
.art-full.eclipse{background:#050403}
.art-full.eclipse svg{position:absolute;inset:0;width:100%;height:100%}
.eclipse-full{position:fixed;inset:0;z-index:70;pointer-events:none;background:#050403;overflow:hidden}
.eclipse-full svg{position:absolute;inset:0;width:100%;height:100%}
.eclipse-full .sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0),rgba(0,0,0,.97));animation:eclSkyFull 4.6s cubic-bezier(.4,0,.3,1) forwards}
.eclipse-full .stars{position:absolute;inset:0;animation:eclStarsFull 4.6s cubic-bezier(.4,0,.3,1) forwards}
.eclipse-full .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 3px 1px rgba(255,255,255,.85)}
.eclipse-full .corona{filter:drop-shadow(0 0 8px var(--accent)) drop-shadow(0 0 22px var(--accent));animation:eclGlowFull 4.6s cubic-bezier(.4,0,.3,1) forwards}
.eclipse-full .moon-g{animation:eclMoonFull 4.6s cubic-bezier(.45,0,.3,1) forwards}
@keyframes eclMoon{0%{transform:translateX(-70px)}45%,55%{transform:translateX(0)}100%{transform:translateX(70px)}}
@keyframes eclSky{0%,100%{opacity:0}45%,55%{opacity:1}}
@keyframes eclStars{0%,100%{opacity:0}45%,55%{opacity:1}}
@keyframes eclGlow{0%,100%{filter:drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 16px var(--accent))}48%,52%{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 30px var(--accent))}}
@keyframes eclMoonFull{0%{transform:translateX(-95px)}42%,58%{transform:translateX(0)}100%{transform:translateX(95px)}}
@keyframes eclSkyFull{0%,100%{opacity:0}42%,58%{opacity:1}}
@keyframes eclStarsFull{0%,100%{opacity:0}42%,58%{opacity:1}}
@keyframes eclGlowFull{0%,100%{filter:drop-shadow(0 0 8px var(--accent)) drop-shadow(0 0 22px var(--accent))}46%,54%{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 40px var(--accent))}}
/* --- кровавое затмение --- */
.eclipse-full.blood{background:#0B0202}
.eclipse-full.blood .sky{background:radial-gradient(ellipse at 50% 42%,rgba(150,10,14,.34),rgba(10,0,0,.97));animation-duration:5.6s}
.eclipse-full.blood .stars{animation-duration:5.6s}
.eclipse-full.blood .stars i{background:#FF6A6A;box-shadow:0 0 4px 1px rgba(220,30,30,.9)}
.eclipse-full.blood .corona{filter:drop-shadow(0 0 10px #B3161C) drop-shadow(0 0 34px #8E0E14);animation:eclGlowBlood 5.6s cubic-bezier(.4,0,.3,1) forwards}
.eclipse-full.blood .moon-g{animation-duration:5.6s}
.eclipse-full.blood::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(200,26,32,.30),transparent 62%);mix-blend-mode:screen;animation:bloodPulse 5.6s ease-in-out forwards}
@keyframes eclGlowBlood{0%{filter:drop-shadow(0 0 6px #7A0B10) drop-shadow(0 0 14px #5A070B)}46%,56%{filter:drop-shadow(0 0 16px #FF2A32) drop-shadow(0 0 60px #B3161C)}100%{filter:drop-shadow(0 0 8px #7A0B10) drop-shadow(0 0 20px #5A070B)}}
@keyframes bloodPulse{0%{opacity:0}40%{opacity:.5}60%{opacity:1}100%{opacity:0}}
.eclipse-full .drips{position:absolute;inset:0;overflow:hidden}
.eclipse-full .drips i{position:absolute;top:-60px;border-radius:0 0 60% 60%/0 0 100% 100%;background:linear-gradient(180deg,rgba(120,8,12,0),#9E1016 28%,#C81A20);box-shadow:0 0 10px rgba(160,12,18,.75);animation:dripFall cubic-bezier(.45,.05,.55,1) forwards}
@keyframes dripFall{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(112vh);opacity:.85}}

/* кнопка затмения в шапке — видна и на телефоне */
.chip.fin{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:10px;padding:2px 7px;margin-right:6px}
.top-acts{display:flex;align-items:center;gap:8px;flex:none}
.ecl-btn{position:relative;width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:#0A0706;display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer}
.ecl-btn:hover,.ecl-btn:focus-visible{border-color:var(--accent)}
.ecl-btn .ecl-sun{position:absolute;width:20px;height:20px;border-radius:50%;background:#F0C77A;box-shadow:0 0 7px 1px rgba(240,199,122,.85),0 0 14px 3px rgba(200,26,32,.45);animation:eclBtnGlow 7s ease-in-out infinite}
.ecl-btn .ecl-moon{position:absolute;width:20px;height:20px;border-radius:50%;background:#0A0706;animation:eclBtnMoon 7s linear infinite}
@keyframes eclBtnMoon{0%{transform:translateX(-17px)}45%,55%{transform:translateX(-3px)}100%{transform:translateX(17px)}}
@keyframes eclBtnGlow{0%,100%{box-shadow:0 0 7px 1px rgba(240,199,122,.85),0 0 14px 3px rgba(200,26,32,.45)}48%,52%{box-shadow:0 0 10px 2px #fff,0 0 22px 7px rgba(200,26,32,.8)}}
.ecl-btn:active .ecl-sun{background:#C81A20;box-shadow:0 0 12px 3px rgba(200,26,32,.95)}
@media (prefers-reduced-motion: reduce){.ecl-btn .ecl-moon{animation:none;transform:translateX(-3px)}.ecl-btn .ecl-sun{animation:none}.eclipse-full .drips i{animation:none;opacity:.8}.eclipse-full.blood::after{animation:none;opacity:.55}}
@media (prefers-reduced-motion: reduce){.eclipse .moon-g,.eclipse-full .moon-g{animation:none;transform:translateX(0)}.eclipse .sky,.eclipse-full .sky,.eclipse .stars,.eclipse-full .stars{animation:none;opacity:1}.eclipse .corona,.eclipse-full .corona{animation:none}}

/* skin details */
[data-skin="berserk"] body{background:radial-gradient(ellipse 820px 380px at 78% -140px,rgba(179,22,28,.26),transparent 70%) no-repeat,var(--bg)}
[data-skin="berserk"] h1{text-shadow:0 2px 30px rgba(179,22,28,.28)}
[data-skin="berserk"] .panel{background-image:linear-gradient(180deg,rgba(255,255,255,.028),transparent 45%)}
[data-skin="berserk"] .btn.primary{text-transform:uppercase;letter-spacing:.14em;font-size:13px;border-color:#D8363B}
[data-skin="berserk"] .btn.primary.big{font-size:15px}
[data-skin="berserk"] .quote blockquote{font-style:italic;font-size:clamp(21px,3.8vw,27px)}
[data-skin="berserk"] .mark{border-radius:50%;background:#050404;box-shadow:0 0 0 2.5px var(--accent),0 0 14px 2px rgba(179,22,28,.7)}
[data-skin="berserk"] .deco.blade{display:block;width:min(360px,80%);height:12px;color:var(--muted);opacity:.7}
[data-skin="berserk"] .rank .badge{background:#050404;color:var(--ink);box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(179,22,28,.55)}
[data-skin="rocky"] .panel{border:1.5px solid var(--ink)}
[data-skin="rocky"] .panel.lift{box-shadow:var(--shadow)}
[data-skin="rocky"] .btn.primary{text-transform:uppercase;letter-spacing:.08em;box-shadow:3px 3px 0 var(--ink);border-color:var(--ink)}
[data-skin="rocky"] .btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
[data-skin="rocky"] .quote blockquote{text-transform:uppercase;letter-spacing:.01em}
[data-skin="rocky"] .mark{color:var(--plate-y);font-size:24px;line-height:1}
[data-skin="rocky"] .mark::before{content:"★"}
[data-skin="rocky"] .deco.stripes{display:block;width:120px;height:9px;background:linear-gradient(180deg,var(--accent) 0 33%,#fff 33% 66%,var(--plate-g) 66%);border:1px solid var(--ink)}
[data-skin="rocky"] .nav{border-color:var(--ink)}
[data-skin="rocky"] .ph,[data-skin="rocky"] .frames img{border:1.5px solid var(--ink)}
[data-skin="rocky"] .rank .badge{background:var(--plate-y);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
[data-skin="rocky"] .flash{background:radial-gradient(circle,rgba(201,154,30,.5),rgba(181,18,27,.6))}
[data-skin="classic"] .mark{border-radius:50%;box-shadow:inset 0 0 0 6px var(--accent)}

/* ---------- Берсерк: тушь ---------- */
:root[data-skin="ink"]{
  --bg:#E3E0DA; --surface:#F0EDE7; --surface2:#E7E3DC; --ink:#0F0E0E; --muted:#56514C; --line:#BDB7AE;
  --accent:#A8121A; --accent-soft:#F1D9D6; --on-accent:#F7F3EE;
  --plate-g:#55595E; --plate-y:#7A5424; --plate-r:#A8121A; --plate-ink-y:#F7F3EE;
  --good:#3E5F2E; --warn:#8A5A12; --bad:#A8121A; --shadow:5px 5px 0 #0F0E0E;
  --r:2px; --r-img:2px; --photo-filter:grayscale(1) contrast(1.35);
  --f-display:'Cormorant SC','Cormorant',Georgia,serif; --h-weight:700; --h-track:.05em; --f-quote:'Cormorant','Cormorant SC',Georgia,serif;
  --art-filter:grayscale(1) contrast(1.2); --art-shade:linear-gradient(180deg,rgba(227,224,218,0) 25%,rgba(227,224,218,.88) 72%,#E3E0DA); --art-ink:#0F0E0E; --art-ts:none;
  color-scheme:light;
}
[data-skin="ink"] body{background-color:var(--bg);background-image:radial-gradient(rgba(15,14,14,.05) 1px,transparent 1.2px);background-size:4px 4px}
[data-skin="ink"] .panel{border:1.5px solid var(--ink)}
[data-skin="ink"] .panel.lift{box-shadow:var(--shadow)}
[data-skin="ink"] .btn.primary{text-transform:uppercase;letter-spacing:.14em;font-size:13px;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
[data-skin="ink"] .btn.primary.big{font-size:15px}
[data-skin="ink"] .quote blockquote{font-style:italic;font-size:clamp(21px,3.8vw,28px)}
[data-skin="ink"] .mark{border-radius:50%;background:var(--ink);box-shadow:0 0 0 2.5px var(--accent)}
[data-skin="ink"] .deco.blade{display:block;width:min(360px,80%);height:12px;color:var(--ink)}
[data-skin="ink"] .rank .badge{background:var(--ink);color:#F7F3EE;box-shadow:0 0 0 2px var(--accent)}
[data-skin="ink"] .ph,[data-skin="ink"] .frames img{border:1.5px solid var(--ink)}
[data-skin="ink"] .nav{border-color:var(--ink)}
[data-skin="ink"] .flash{background:radial-gradient(circle,rgba(168,18,26,.55),rgba(15,14,14,.85))}
.sw-ink{background:radial-gradient(circle at 30% 45%,#A8121A 0 4px,transparent 5px),radial-gradient(circle at 42% 70%,#A8121A 0 2px,transparent 3px),linear-gradient(90deg,#E3E0DA 0 62%,#0F0E0E 62%)}

/* ---------- картины тем, брызги, свой фон ---------- */
:root{--art-filter:none;--art-shade:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.78));--art-ink:#fff;--art-ts:0 1px 14px rgba(0,0,0,.6)}
:root[data-skin="berserk"]{--art-filter:invert(1) contrast(1.15) brightness(.7);--art-shade:linear-gradient(180deg,rgba(10,9,9,.05),rgba(10,9,9,.55) 45%,rgba(10,9,9,.96)),radial-gradient(ellipse at 85% 0%,rgba(179,22,28,.45),transparent 55%);--art-ink:#EFE6DA}
:root[data-skin="rocky"]{--art-filter:sepia(.5) contrast(1.05);--art-shade:linear-gradient(180deg,rgba(22,22,26,0) 25%,rgba(22,22,26,.88));--art-ink:#fff}
.art{position:relative;border-radius:var(--r);overflow:hidden;min-height:240px;display:flex;align-items:flex-end;border:1px solid var(--line);background:var(--surface)}
[data-skin="ink"] .art,[data-skin="rocky"] .art{border:1.5px solid var(--ink)}
.art .img,.art-full .img{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:var(--art-filter)}
.art.user .img,.art-full.user .img{filter:none}
.art .shade,.art-full .shade{position:absolute;inset:0;background:var(--art-shade)}
.art-body{position:relative;padding:18px 16px 14px;display:flex;flex-direction:column;gap:8px;width:100%}
.art .quote blockquote,.art .quote .btn{color:var(--art-ink);text-shadow:var(--art-ts)}
.art-cap{font-size:11px;color:var(--art-ink);opacity:.72}
.art-full{position:relative;overflow:hidden;border-radius:var(--r);padding:28px 16px}
.art-full h1,.art-full .muted,.art-full blockquote{color:var(--art-ink);text-shadow:var(--art-ts)}
.art-full .shade{background:var(--art-full-shade)}
:root{--art-full-shade:linear-gradient(rgba(0,0,0,.66),rgba(0,0,0,.86))}
:root[data-skin="berserk"]{--art-full-shade:radial-gradient(ellipse at 50% 0%,rgba(179,22,28,.35),transparent 60%),linear-gradient(rgba(10,9,9,.7),rgba(10,9,9,.92))}
:root[data-skin="ink"]{--art-full-shade:linear-gradient(rgba(227,224,218,.8),rgba(227,224,218,.93))}
:root[data-skin="rocky"]{--art-full-shade:linear-gradient(rgba(22,22,26,.7),rgba(22,22,26,.9))}
.splat{position:absolute;right:-6px;top:-8px;width:min(58%,340px);color:var(--accent);opacity:.82;pointer-events:none}
.ch{position:relative;overflow:hidden}
.ch>*:not(.splat){position:relative}
.wk-card{text-align:left;cursor:pointer;gap:8px;font:inherit;color:var(--ink)}
.wk-card:hover{border-color:var(--accent)}
#ubg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:.2;pointer-events:none}

/* ---------- Космодесант ---------- */
:root[data-skin="space"]{
  --bg:#080B14; --surface:#0F1420; --surface2:#161C2C; --ink:#E7EEFC; --muted:#7C89A8; --line:#232B42;
  --accent:#FF6A1A; --accent-soft:#2A1B10; --on-accent:#0B0E14;
  --plate-g:#3D8BFF; --plate-y:#FFC24B; --plate-r:#FF6A1A; --plate-ink-y:#0B0E14;
  --good:#3ED598; --warn:#FFC24B; --bad:#FF5A5A; --shadow:0 18px 40px rgba(0,0,0,.6);
  --r:10px; --r-img:8px; --photo-filter:none;
  --f-display:'Oswald','Arial Narrow',sans-serif; --h-weight:700; --h-track:.12em; --f-quote:'Oswald','Arial Narrow',sans-serif;
  color-scheme:dark;
}
[data-skin="space"] body{background-color:var(--bg);background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 8%,#fff,transparent),radial-gradient(1px 1px at 34% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 44%,#fff,transparent),radial-gradient(1px 1px at 58% 82%,#fff,transparent),radial-gradient(1px 1px at 6% 90%,#fff,transparent);background-repeat:no-repeat;background-size:100% 100%;opacity:1}
[data-skin="space"] h1,[data-skin="space"] h2{font-weight:700}
[data-skin="space"] .panel{border-color:var(--line)}
[data-skin="space"] .panel.lift{box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,106,26,.12)}
[data-skin="space"] .btn.primary{text-transform:uppercase;letter-spacing:.14em;font-size:13px}
[data-skin="space"] .quote blockquote{font-style:normal;letter-spacing:.01em}
[data-skin="space"] .mark{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 55%,#7a3000 100%);box-shadow:0 0 10px 1px rgba(255,106,26,.7)}
[data-skin="space"] .deco.blade{display:none}
[data-skin="space"] .rank .badge{background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 55%,#7a3000 100%);color:#0B0E14;box-shadow:0 0 16px 2px rgba(255,106,26,.6)}
[data-skin="space"] .ph,[data-skin="space"] .frames img{border-color:var(--line)}
[data-skin="space"] .flash{background:radial-gradient(circle,rgba(255,106,26,.5),rgba(8,11,20,.9))}
.sw-space{background:radial-gradient(circle at 25% 40%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 60% 70%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 80% 25%,#fff 0 1px,transparent 1.5px),linear-gradient(90deg,#080B14 0 65%,#FF6A1A 65%)}
:root[data-skin="space"]{--art-filter:none;--art-shade:linear-gradient(180deg,rgba(8,11,20,0) 20%,rgba(8,11,20,.55) 48%,rgba(8,11,20,.97));--art-ink:#E7EEFC;--art-full-shade:linear-gradient(rgba(8,11,20,.55),rgba(8,11,20,.92))}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.flash,.spin{animation:none}}
</style>

<script>
/* ================= ДАННЫЕ ПРИЛОЖЕНИЯ «ПОДХОД» =================
   Фото: Free Exercise DB (общественное достояние) и Wikimedia Commons (см. CREDITS).

   eq — нужный инвентарь дома: db гантели, bar турник, bench скамья, bag мешок, rope скакалка, kb гиря. */
const X=(name,grp,pl,pat,lv,type,equip,steps,mistakes,breath,easier,harder,o={})=>Object.assign({name,grp,pl,pat,lv,type,equip,steps,mistakes,breath,easier,harder},o);
const EX={
goodMorning:X('Наклон со штангой',['Спина'],'hg','hinge','mid','reps','Штанга',['Штанга на верхе трапеций, ноги на ширине таза, колени чуть мягкие.','Уводите таз назад и наклоняйте корпус вперёд с прямой спиной.','Опускайтесь, пока не почувствуете натяжение бицепса бедра, и поднимитесь.'],['Круглая спина','Сгибание коленей вместо наклона таза','Слишком большой вес'],'Вдох в наклоне, выдох на подъёме.','Наклон без веса или с палкой.','Пауза 2 секунды в нижней точке.',{w:1}),
sumoDl:X('Становая тяга сумо',['Ноги','Спина'],'g','hinge','mid','reps','Штанга',['Ноги широко, носки развёрнуты, гриф у голеней, хват внутри ног.','Грудь вверх, спина прямая, таз ниже, чем в классике.','Разгибайте ноги и таз одновременно, ведя гриф вплотную к телу.'],['Округление поясницы','Таз взлетает раньше груди','Гриф уходит вперёд'],'Вдох перед подъёмом, выдох наверху.','Тяга с плинтов или гири.','Пауза в 5 см от пола.',{w:1}),
pullThrough:X('Протяжка в блоке',['Ягодицы','Спина'],'g','hinge','beg','reps','Нижний блок',['Встаньте спиной к нижнему блоку, канат между ног, шагните вперёд.','Уводите таз назад, наклоняясь с прямой спиной.','Резко выпрямитесь, сжав ягодицы в верхней точке.'],['Тяга руками вместо таза','Переразгибание поясницы наверху'],'Вдох в наклоне, выдох на выпрямлении.','Меньше вес, короче амплитуда.','Пауза 2 секунды в сжатии.',{w:1}),
hyperext:X('Гиперэкстензия без тренажёра',['Спина','Ягодицы'],'hg','back','mid','reps','Коврик',['Лягте на живот, руки у висков, ноги прямые.','На выдохе поднимайте грудь и бёдра от пола за счёт спины и ягодиц.','Задержитесь на секунду и плавно опуститесь.'],['Рывки','Запрокидывание головы','Переразгибание поясницы'],'Выдох на подъёме, вдох на опускании.','Поднимайте только корпус, ноги на полу.','Держите 3 секунды наверху или возьмите блин.'),
sglBridge:X('Ягодичный мост на одной ноге',['Ягодицы'],'hf','glutes','mid','reps','Коврик',['Лягте на спину, одна стопа на полу, вторая нога выпрямлена вверх.','Упритесь пяткой и поднимите таз до линии плечо–колено.','Сожмите ягодицу наверху и опуститесь, не касаясь пола.'],['Перекос таза','Работа поясницей вместо ягодицы','Опора на носок'],'Выдох на подъёме, вдох вниз.','Обычный мост на двух ногах.','Пауза 3 секунды наверху.'),
walkLunge:X('Выпады в движении',['Ноги','Ягодицы'],'hgf','lunge','beg','reps','—',['Встаньте прямо, руки на поясе или с гантелями.','Сделайте широкий шаг вперёд и опуститесь до угла 90° в обоих коленях.','Оттолкнитесь передней ногой и сразу шагните другой ногой вперёд.'],['Колено уходит за носок','Короткий шаг','Заваливание корпуса'],'Вдох вниз, выдох на подъёме.','Выпады на месте с опорой.','Гантели в руках или штанга на спине.'),
calfMachine:X('Подъём на носки в тренажёре',['Икры'],'g','calf','beg','reps','Тренажёр',['Встаньте в тренажёр, плечи под валиками, носки на платформе.','Опустите пятки как можно ниже, чувствуя растяжение икры.','Поднимитесь на носки максимально высоко и задержитесь на секунду.'],['Короткая амплитуда','Рывки','Сгибание коленей'],'Выдох на подъёме, вдох вниз.','Меньше вес, больше амплитуда.','Пауза 2 секунды вверху и внизу.',{w:1}),
donkeyCalf:X('Подъём на носки «ослик»',['Икры'],'g','calf','mid','reps','Платформа',['Наклонитесь корпусом вперёд, опираясь руками, носки на платформе.','Опустите пятки ниже уровня платформы.','Мощно поднимитесь на носки, не разгибая корпус.'],['Разгибание корпуса','Пружинящие полуповторы'],'Выдох на подъёме, вдох вниз.','Без дополнительного веса.','Партнёр на спине или пояс с весом.',{w:1}),
invRow:X('Австралийские подтягивания',['Спина','Руки'],'hgf','pull','beg','reps','Низкая перекладина',['Возьмитесь за перекладину на уровне пояса, тело прямое, пятки на полу.','Сведите лопатки и подтяните грудь к перекладине.','Опуститесь под контролем до полного выпрямления рук.'],['Провисание таза','Работа только руками','Рывки корпусом'],'Выдох на подтягивании, вдох вниз.','Поднимите перекладину выше, согните колени.','Опустите перекладину ниже или закиньте ноги на возвышение.'),
pallof:X('Жим Палоффа',['Пресс'],'g','core','beg','time','Блок',['Встаньте боком к блоку, рукоять у груди двумя руками.','Выжмите руки прямо перед собой, сопротивляясь развороту корпуса.','Держите, затем вернитесь к груди, не позволяя корпусу скрутиться.'],['Разворот корпуса','Задержка дыхания','Слишком большой вес'],'Ровное дыхание, не задерживайте.','Встаньте ближе к блоку.','Шаг дальше от блока или выше вес.'),
frogSitup:X('Складка «лягушка»',['Пресс'],'hf','core','mid','reps','Коврик',['Лягте на спину, стопы вместе, колени разведены в стороны.','Руки за головой или вдоль корпуса.','Скручивайтесь вверх, тянясь грудью к стопам, и плавно опускайтесь.'],['Рывок руками за шею','Отрыв поясницы рывком'],'Выдох на подъёме, вдох вниз.','Руки вдоль корпуса, короче амплитуда.','Блин на груди или пауза наверху.'),
frogHops:X('Лягушачьи прыжки',['Ноги','Кардио'],'hf','plyo','mid','reps','—',['Присядьте глубоко, руки между ног, спина прямая.','Мощно вытолкнитесь вперёд и вверх, приземляясь снова в присед.','Сразу же повторяйте, сохраняя низкую стойку.'],['Приземление на прямые ноги','Круглая спина','Пауза между прыжками'],'Выдох на прыжке.','Прыжки на месте без продвижения.','Дальше прыжок или прыжки в горку.'),
thruster:X('Трастер с гирей',['Всё тело'],'hg','squat','mid','reps','Гиря',['Гиря в стойке у плеча, локоть прижат, ноги на ширине плеч.','Присядьте до параллели, держа корпус вертикально.','Мощно встаньте и на инерции выжмите гирю над головой.'],['Выжимание отдельно от приседа','Прогиб в пояснице наверху','Заваливание вперёд'],'Вдох в приседе, выдох на выжиме.','Присед и жим раздельно, меньше вес.','Две гири или без паузы между повторами.',{w:1}),
handstandPush:X('Отжимания в стойке на руках',['Плечи','Руки'],'hg','pushV','adv','reps','Стена',['Встаньте в стойку на руках у стены, ладони чуть шире плеч.','Согните локти и опуститесь, пока макушка не коснётся пола.','Мощно выжмите себя обратно в стойку.'],['Прогиб в пояснице','Разведённые локти','Падение на голову'],'Вдох вниз, выдох на выжиме.','Отжимания «домиком» ногами на возвышении.','Без стены или с паузой внизу.',{note:'Только у стены и на мягкой поверхности.'}),
hangPike:X('Подъём ног в вис до перекладины',['Пресс'],'hg','core','adv','reps','Турник',['Повисните на перекладине, плечи активны, ноги прямые.','Не раскачиваясь, поднимайте прямые ноги к перекладине.','Опускайте медленно, сохраняя контроль.'],['Раскачка','Согнутые колени','Бросание ног вниз'],'Выдох на подъёме, вдох вниз.','Подъём коленей к груди.','Пауза наверху 2 секунды.'),
catStretch:X('Кошка-корова',['Растяжка'],'hgf','cool','beg','time','Коврик',['Встаньте на четвереньки, ладони под плечами, колени под тазом.','На вдохе прогните спину вниз, поднимая голову и таз (корова).','На выдохе округлите спину, подбородок к груди (кошка).'],['Резкие рывки','Задержка дыхания'],'Вдох на прогибе, выдох на округлении.','Меньше амплитуда.','Задержка 3 секунды в каждой точке.'),
childPose:X('Поза ребёнка',['Растяжка'],'hgf','cool','beg','time','Коврик',['Сядьте на пятки, колени чуть разведены.','Наклонитесь вперёд, вытянув руки перед собой.','Опустите лоб на пол и расслабьте плечи.'],['Напряжённые плечи','Задержка дыхания'],'Медленное глубокое дыхание.','Руки вдоль корпуса.','Растяните руки дальше вперёд.'),
hamstringStretch:X('Растяжка задней поверхности бедра',['Растяжка'],'hgf','cool','beg','time','Коврик',['Сядьте, одна нога прямая, другая согнута стопой к бедру.','Наклонитесь вперёд к прямой ноге с прямой спиной.','Тянитесь грудью к колену, не круглите поясницу.'],['Круглая спина','Рывки'],'Выдох на наклоне.','Меньше наклон.','Обе ноги прямые.',{note:'на каждую ногу'}),
quadStretch:X('Растяжка квадрицепса стоя',['Растяжка'],'hgf','cool','beg','time','Без инвентаря',['Встаньте прямо, при необходимости держитесь за опору.','Согните ногу назад и возьмитесь за стопу.','Тяните пятку к ягодице, колени рядом.'],['Прогиб в пояснице','Колено уходит в сторону'],'Ровное дыхание.','Держитесь за стену.','Наклоните корпус чуть вперёд.',{note:'на каждую ногу'}),
chestOpener:X('Растяжка груди и плеч',['Растяжка'],'hgf','cool','beg','time','Без инвентаря',['Встаньте прямо, сцепите руки за спиной.','Выпрямите руки и поднимите их, сводя лопатки.','Раскройте грудную клетку вперёд.'],['Круглая спина','Задранные плечи'],'Глубокий вдох на раскрытии груди.','Меньше амплитуда.','Наклонитесь вперёд с прямыми руками.'),
figureFour:X('Растяжка ягодиц «четвёрка»',['Растяжка'],'hgf','cool','beg','time','Коврик',['Лягте на спину, согните колени.','Положите щиколотку одной ноги на колено другой.','Подтяните бедро опорной ноги к груди, обхватив его руками.'],['Резкие рывки','Прямая шея напряжена'],'Ровное дыхание, тянитесь на выдохе.','Меньше подтягивание.','Сидя, наклон вперёд.',{note:'на каждую ногу'}),
worldGreatest:X('Растяжка «лучшая в мире»',['Растяжка'],'hgf','cool','mid','time','Без инвентаря',['Из выпада вперёд опустите разноимённую руку на пол.','Разверните грудную клетку и поднимите вторую руку к потолку.','Верните руку, выпрямите переднюю ногу, тянитесь к стопе.'],['Потеря равновесия','Спешка'],'Глубокое дыхание в каждой позиции.','Только выпад и поворот.','Добавьте растяжку икры в конце.',{note:'на каждую сторону'}),

pushup:X('Отжимания',['Грудь','Руки'],'hgf','push','mid','reps','Без инвентаря',['Примите упор лёжа: ладони чуть шире плеч, тело — прямая линия от макушки до пяток.','Напрягите ягодицы и пресс.','Сгибайте локти под углом около 45° к корпусу, опускаясь грудью к полу.','Остановитесь в 2–3 см от пола.','Выжмите себя вверх, сохраняя линию тела.'],['Провисает поясница','Локти разведены на 90°','Неполная амплитуда'],'Вдох вниз, выдох на усилии.','Отжимания от опоры: скамьи, ящика или стола.','Ноги на возвышении, пауза внизу.'),

function genCooldown(seed){

function pickMethod(p,R){

function applyMethod(w,m,L){

}
function gen(p,ctx){
  ctx=ctx||{eq:S.profile.eq||[],recent:recentIds(),goal:S.profile.goal};
  const R=rng(hash(p.seed!=null?p.seed:Math.random()*1e9));

  const slots=SLOTS[p.focus]||SLOTS.full,per=m==='tabata'?5:m==='amrap'||m==='emom'?9:p.place==='fight'?8:p.place==='gym'?10:9.5;
  const n=clamp(Math.round(p.minutes/per),3,slots.length);
  const used=new Set(),items=[];
  for(let i=0;i<slots.length&&items.length<n;i++){
    const pats=slots[i].split('|');
    const pool=Object.keys(EX).filter(id=>!used.has(id)&&pats.includes(EX[id].pat)&&exOk(id,p.place,p.lv,ctx.eq));
    if(!pool.length)continue;

/* тренировка должна укладываться в выбранное время: режем объём, а не жёсткость */
function fitTime(w){

  const cap=Math.round(w.minutes*1.12);
  const core=()=>w.items.filter(it=>!it.fin);
  const floor=w.minutes<=25?2:3;
  for(let guard=0;guard<40&&estMin(w)>cap;guard++){
    const c=core();
    if(c.length>floor){const last=c[c.length-1];w.items.splice(w.items.indexOf(last),1);continue}
    // дальше режем подходы у самого объёмного упражнения, но не ниже 3
    let best=null;c.forEach(it=>{if(it.sets>3&&(!best||it.sets>best.sets))best=it});
    if(best){best.sets--;if(best.repsBy&&best.repsBy.length>best.sets)best.repsBy=best.repsBy.slice(0,best.sets);continue}
    // если и это не помогло — укорачиваем раунды по времени
    let t=null;c.forEach(it=>{if(it.time&&it.time>60&&(!t||it.time>t.time))t=it});
    if(t){t.time=Math.max(60,t.time-30);continue}
    // в самом конце жертвуем добивкой — лучше короткая честная тренировка
    const fi=w.items.findIndex(it=>it.fin);

function addFinisher(w,L,R,p,ctx){

  if(!pool.length)return;

  const fins=[];its.forEach((it,i)=>{if(it.fin)fins.push(i)});
  const tailFin=()=>fins.forEach(i=>{const it=its[i];for(let s=1;s<=it.sets;s++)st(i,s,s===it.sets?0:(it.rest??30),rt(it,s))});

  s.profile=Object.assign(blankProfile(),{sex:'m',age:30,height:180,activity:1.55,goal:'lose',level:'mid',goalWeight:78,place:'gym',days:[1,3,5],minutes:45,eq:['db','bar','rope']});
  for(let i=42;i>=0;i-=(i%5===0?3:2))s.weights.push({d:addDays(tk,-i),w:r1(84.9-(42-i)*.052+(R()-.5)*.6),waist:i%7===0?r1(92-(42-i)*.06):undefined});
  const cyc=[['gym','upper'],['gym','lower'],['fight','boxing'],['home','full'],['gym','full'],['fight','kick']];let k=0;
  for(let i=30;i>=1;i--){
    const d=addDays(tk,-i),wd=parseKey(d).getDay();if(![1,3,5].includes(wd)||R()<.12)continue;
    const [place,focus]=cyc[k++%cyc.length],prog=Math.floor((30-i)/10);
    const recent=new Set();s.workouts.slice(-3).forEach(w=>w.ex.forEach(e=>recent.add(e.id)));
    const w=gen({place,focus,minutes:45,lv:'mid',seed:'demo'+d},{eq:s.profile.eq,recent,goal:'lose'});
    const ex=w.items.map(it=>({id:it.ex,sets:Array.from({length:it.sets},(_,j)=>it.time?{t:it.time}:{r:Math.max(1,it.reps-(j>=2&&R()<.4?1:0)),kg:EX[it.ex].w?(DEMO_KG[it.ex]||10)+prog*2:0})}));
    const start=parseKey(d);start.setHours(i%4===0?6:18,30);
    const rec={id:newId(),d,ts:start.getTime(),dur:estMin(w)*60+Math.round(R()*300),level:'mid',place,title:w.title,kind:'gen',method:w.method,ex};rec.vol=volOf(rec);rec.kcal=Math.round(6*83*rec.dur/3600);rec.xp=xpOf(rec);s.workouts.push(rec);
  }
  const add=(d,meal,n,g)=>{const f=FOODS.find(x=>x.n===n);(s.food[d]||(s.food[d]=[])).push(foodEntry(f,g,meal))};
  const menus=[[['b','Овсянка на воде',250],['b','Банан',120],['b','Творог 5%',150],['l','Гречка варёная',200],['l','Куриная грудка отварная',180],['l','Огурец',150],['s','Йогурт греческий 2%',170],['d','Лосось',150],['d','Брокколи',200],['d','Рис варёный',150]],
    [['b','Омлет',180],['b','Хлеб цельнозерновой',60],['b','Помидор',120],['l','Плов с курицей',300],['s','Яблоко',180],['s','Грецкие орехи',20],['d','Творог 0%',200],['d','Картофель отварной',200],['d','Треска',200]]];
  for(let i=6;i>=1;i--){const d=addDays(tk,-i);menus[i%2].forEach(([m,n,g])=>add(d,m,n,Math.round(g*(.85+R()*.3))));s.water[d]=1750+Math.round(R()*5)*250}
  menus[0].slice(0,6).forEach(([m,n,g])=>add(tk,m,n,g));s.water[tk]=1250;
  return s;
}

/* ---------- derived ---------- */
function foodEntry(f,g,meal){const q=g/100;return{id:newId(),meal,name:f.n,g,kcal:Math.round(f.k*q),p:r1(f.p*q),f:r1(f.f*q),c:r1(f.c*q)}}
function volOf(w){let v=0;w.ex.forEach(e=>e.sets.forEach(s=>{if(s.kg&&s.r)v+=s.kg*s.r}));return Math.round(v)}
function xpOf(w){const sets=w.ex.reduce((a,e)=>a+e.sets.length,0);return Math.round(10+w.dur/60+sets*2+(w.vol||0)/250)}
const totalXP=()=>S.workouts.reduce((a,w)=>a+(w.xp||xpOf(w)),0);
function rankOf(xp){let i=0;RANKS.at.forEach((t,k)=>{if(xp>=t)i=k});const nx=RANKS.at[i+1];return{i,name:RANKS[sk()][i],next:nx!=null?RANKS[sk()][i+1]:null,nextAt:nx,frac:nx?(xp-RANKS.at[i])/(nx-RANKS.at[i]):1}}
function weekStreak(){const tgt=Math.max(1,S.profile.days.length);let m=mondayOf(todayKey()),n=0;const cnt=s=>S.workouts.filter(w=>w.d>=s&&w.d<=addDays(s,6)).length;if(cnt(m)>=tgt)n++;m=addDays(m,-7);while(cnt(m)>=tgt&&n<520){n++;m=addDays(m,-7)}return n}
const lastW=()=>S.weights.length?S.weights[S.weights.length-1]:null;
function targets(){
  const p=S.profile,w=(lastW()||{}).w||75;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.activity;
  const kcal=Math.round((p.goal==='lose'?tdee*.85:p.goal==='gain'?tdee*1.1:tdee)/10)*10;
  const prot=Math.round(w*(p.goal==='lose'?2:1.8)),fat=Math.round(w*.9),carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carb,water:Math.round(w*30/250)*250};
}
function dayTot(d){const t={kcal:0,p:0,f:0,c:0};(S.food[d]||[]).forEach(e=>{t.kcal+=e.kcal;t.p+=e.p;t.f+=e.f;t.c+=e.c});return t}
function lastKg(exId){for(let i=S.workouts.length-1;i>=0;i--){const e=S.workouts[i].ex.find(x=>x.id===exId);if(e){const s=e.sets.filter(x=>x.kg);if(s.length)return s[s.length-1].kg}}return 0}
function records(){
  const pr={};S.workouts.forEach(w=>w.ex.forEach(e=>e.sets.forEach(s=>{const r=pr[e.id]||(pr[e.id]={kg:0,kgR:0,r:0,t:0,d:''});
    if(s.kg&&(s.kg>r.kg||(s.kg===r.kg&&s.r>r.kgR))){r.kg=s.kg;r.kgR=s.r;r.d=w.d}
    if(s.r&&s.r>r.r){r.r=s.r;if(!r.kg)r.d=w.d}if(s.t&&s.t>r.t){r.t=s.t;r.d=w.d}})));return pr;
}
function exHistory(id){const out=[];S.workouts.forEach(w=>{const e=w.ex.find(x=>x.id===id);if(!e||!e.sets.length)return;
  let kg=0,r=0,t=0,e1=0,vol=0;e.sets.forEach(s=>{if(s.kg>kg)kg=s.kg;if(s.r>r)r=s.r;if(s.t>t)t=s.t;if(s.kg&&s.r){e1=Math.max(e1,s.kg*(1+s.r/30));vol+=s.kg*s.r}});
  out.push({d:w.d,sets:e.sets,kg,r,t,e1:r1(e1),vol})});return out}
function metricOf(id,h){const e=EX[id];if(e.type==='time')return{k:'t',label:'Лучшее время, с',v:h.t};if(e.w&&h.kg)return{k:'e1',label:'Расчётный максимум (1ПМ), кг',v:h.e1};return{k:'r',label:'Лучший подход, повторов',v:h.r}}
function bmiInfo(){const w=(lastW()||{}).w;if(!w)return null;const b=w/((S.profile.height/100)**2);const c=b<18.5?['Недостаток','warn']:b<25?['Норма','good']:b<30?['Избыток','warn']:['Ожирение','bad'];return{b:r1(b),cat:c[0],tone:c[1]}}
function achievements(){
  const W=S.workouts,n=W.length,vol=W.reduce((a,w)=>a+(w.vol||0),0),tg=targets(),tk=todayKey();

    ['Тонна','1 000 кг за одну тренировку',maxVol>=1000],['Грузчик','10 000 кг всего',vol>=10000],['Железный человек','100 000 кг всего',vol>=100000],['Час боли','Тренировка дольше часа',long],
    ['Ранняя пташка','Тренировка до 7 утра',hrs.some(h=>h<7)],['Ночной мечник','Тренировка после 22:00',hrs.some(h=>h>=22)],['Боец','5 тренировок единоборств',fights>=5],['Универсал','Дом, зал и бой',places>=3],

}

    <svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

/* ---------- Таймер ---------- */
const seg0=()=>({run:false,start:0,acc:0,last:-1,b:null});
const T={mode:'rounds',run:{running:false,start:0,acc:0,dist:0,unit:'km',lastTs:0,pace:0},rd:{round:180,rest:60,rounds:6,prep:10,warn:true,combo:'box',st:seg0()},iv:{work:20,rest:10,rounds:8,prep:10,st:seg0()},rs:{dur:90,left:90000,end:0,run:false},sw:{run:false,start:0,acc:0,laps:[]},cb:{text:'',next:0}};
function segsRd(){const c=T.rd,s=[{k:'prep',d:c.prep}];for(let r=1;r<=c.rounds;r++){s.push({k:'work',d:c.round,r});if(r<c.rounds)s.push({k:'rest',d:c.rest,r})}return s}
function segsIv(){const c=T.iv,s=[{k:'prep',d:c.prep}];for(let r=1;r<=c.rounds;r++){s.push({k:'work',d:c.work,r});if(r<c.rounds)s.push({k:'rest',d:c.rest,r})}return s}
function segState(cfg,segs,now){const st=cfg.st,el=st.acc+(st.run?now-st.start:0);let t=0;for(let i=0;i<segs.length;i++){const d=segs[i].d*1000;if(el<t+d)return{i,seg:segs[i],left:t+d-el};t+=d}return{done:true}}
function vTimer(){
  const m=T.mode;let face='';
  if(m==='rounds'){const c=T.rd,run=c.st.run||c.st.acc;
    face=`<span class="phase" id="tm-phase">Готовность</span><div class="countdown" id="tm-time">0:10</div><div class="muted" id="tm-round">Раунд 0 из ${c.rounds}</div>
    <div class="combo" id="tm-combo" aria-live="polite"></div>${c.combo!=='off'?'<div class="combo-legend">1 джеб · 2 кросс · 3 левый хук · 4 правый хук · 5, 6 апперкоты</div>':''}
    <div class="row" style="justify-content:center"><button class="btn primary big" data-act="rd-toggle">${c.st.run?'Пауза':run?'Продолжить':'Старт'}</button><button class="btn big ghost" data-act="rd-reset">Сброс</button></div>
    <div class="fields" style="width:100%;max-width:620px">
      <div class="field"><label for="rd-round">Раунд</label><select class="input" id="rd-round" data-rd="round" ${run?'disabled':''}>${[60,90,120,180,300].map(v=>`<option value="${v}" ${c.round===v?'selected':''}>${v<120?v+' с':v/60+' мин'}</option>`).join('')}</select></div>
      <div class="field"><label for="rd-rest">Отдых</label><select class="input" id="rd-rest" data-rd="rest" ${run?'disabled':''}>${[30,45,60,90,120].map(v=>`<option value="${v}" ${c.rest===v?'selected':''}>${v} с</option>`).join('')}</select></div>
      <div class="field"><label for="rd-rounds">Раундов</label><input class="input" id="rd-rounds" data-rd="rounds" type="number" min="1" max="30" value="${c.rounds}" ${run?'disabled':''}></div>
      <div class="field"><label for="rd-combo">Комбинации</label><select class="input" id="rd-combo" data-rd="combo">${[['off','Выключены'],['box','Бокс'],['kick','Кикбоксинг']].map(([k,n])=>`<option value="${k}" ${c.combo===k?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>
    <label class="switch" style="width:100%;max-width:620px"><span>Сигнал за 10 секунд до конца раунда</span><input type="checkbox" id="rd-warn" data-rd="warn" ${c.warn?'checked':''}></label>`}
  if(m==='interval'){const v=T.iv,run=v.st.run||v.st.acc,tot=segsIv().reduce((a,s)=>a+s.d,0);
    face=`<span class="phase" id="tm-phase">Готовность</span><div class="countdown" id="tm-time">0:10</div><div class="muted" id="tm-round">Раунд 0 из ${v.rounds}</div>
    <div class="row" style="justify-content:center"><button class="btn primary big" data-act="iv-toggle">${v.st.run?'Пауза':run?'Продолжить':'Старт'}</button><button class="btn big ghost" data-act="iv-reset">Сброс</button></div>
    <div class="fields" style="width:100%;max-width:560px">${[['work','Работа, с'],['rest','Отдых, с'],['rounds','Раунды'],['prep','Подготовка, с']].map(([k,l])=>`<div class="field"><label for="iv-${k}">${l}</label><input class="input" id="iv-${k}" data-iv="${k}" type="number" min="${k==='rounds'?1:0}" value="${v[k]}" ${run?'disabled':''}></div>`).join('')}</div>
    <div class="row" style="justify-content:center"><span class="small muted">Всего ${fmtDur(tot)} ·</span><button class="chip" data-act="iv-preset" data-v="20,10,8">Табата 20/10 × 8</button><button class="chip" data-act="iv-preset" data-v="40,20,10">40/20 × 10</button><button class="chip" data-act="iv-preset" data-v="60,30,6">60/30 × 6</button></div>`}
  if(m==='rest'){face=`${ring('tm-ring','rest')}<div class="row" style="justify-content:center">${[30,45,60,90,120,180].map(s=>`<button class="chip ${T.rs.dur===s?'on':''}" data-act="rs-set" data-v="${s}">${s<60?s+' с':s/60+' мин'}</button>`).join('')}</div>

function swNow(){return T.sw.acc+(T.sw.run?Date.now()-T.sw.start:0)}

function paintSeg(cfg,segs,now,label){

function timerPaint(){

  const rt=document.getElementById('tm-run-time');if(rt){const r=T.run,el=(r.acc+(r.running?now-r.start:0))/1000;rt.textContent=fmtDur(el);const dd=document.getElementById('tm-run-dist');if(dd)dd.textContent=fmt(r.dist,2);const pc=document.getElementById('tm-run-pace');if(pc)pc.textContent=r.dist>0?fmtDur(el/r.dist)+' /'+(r.unit==='km'?'км':'ми'):'—'}
  if(document.getElementById('tm-ring')){const left=T.rs.run?Math.max(0,T.rs.end-now):T.rs.left;setRing('tm-ring',left/(T.rs.dur*1000),fmtDur(Math.ceil(left/1000)),T.rs.run?'отдых':'')}
}
function comboTick(now,type){if(now<T.cb.next)return;T.cb.text=rand(COMBOS[type]||COMBOS.box);T.cb.next=now+3200+Math.random()*2600;say(comboSpeech(T.cb.text))}
const NUMW={'1':'раз','2':'два','3':'три','4':'четыре','5':'пять','6':'шесть'};
const comboSpeech=t=>t.replace(/\d/g,d=>NUMW[d]+' ').replace(/[—-]/g,' ').replace(/\s+/g,' ');
function segTick(cfg,segs,now,kind){
  const st=cfg.st;if(!st.run)return;const s=segState(cfg,segs,now);
  if(s.done){st.run=false;st.acc=0;st.last=-1;bell(3);say('Конец. Отличная работа');wake();if(ui.tab==='timer')render();return}
  if(s.i!==st.last){if(s.seg.k==='work'){bell(1);say(kind==='rd'?'Раунд '+s.seg.r:'Работа')}else if(s.seg.k==='rest'){bell(2);say('Отдых')}st.last=s.i;T.cb.next=now+1500;T.cb.text=''}
  const sec=Math.ceil(s.left/1000);
  if(kind==='rd'&&cfg.warn&&s.seg.k==='work'&&sec===10&&cfg.round>20&&st.b!==s.i+':10'){st.b=s.i+':10';clap()}
  if(sec<=3&&sec>0&&st.b!==s.i+':'+sec){st.b=s.i+':'+sec;beep(660,.08)}
  if(kind==='rd'&&cfg.combo!=='off'&&s.seg.k==='work')comboTick(now,cfg.combo);
}
function timerTick(now){
  segTick(T.rd,segsRd(),now,'rd');segTick(T.iv,segsIv(),now,'iv');
  if(T.rs.run){const left=T.rs.end-now,s=Math.ceil(left/1000);if(s<=3&&s>0&&T.rs.b!==s){T.rs.b=s;beep(660,.1)}if(left<=0){T.rs.run=false;T.rs.left=T.rs.dur*1000;bell(1);buzz([200,100,200]);say('Отдых окончен');wake();if(ui.tab==='timer')render()}}
}

function niceStep(r){return[.2,.5,1,2,5,10,20,50,100].find(s=>r/s<=5)||200}
function lineChart(ent,o={}){
  if(ent.length<2)return '<p class="muted" style="padding:14px 0">Нужно минимум две записи, чтобы построить график.</p>';
  const W=680,H=230,pl=44,pr=66,pt=16,pb=30,dec=o.dec??1,unit=o.unit||'';
  const xs=ent.map(e=>parseKey(e.d).getTime()),x0=xs[0],x1=xs[xs.length-1],vs=ent.map(e=>e.v);
  let lo=Math.min(...vs),hi=Math.max(...vs);const g=o.goal,showG=g!=null&&g>=lo-4&&g<=hi+4;if(showG){lo=Math.min(lo,g);hi=Math.max(hi,g)}
  const st=niceStep((hi-lo||1)/4);lo=Math.floor((lo-st*.3)/st)*st;hi=Math.ceil((hi+st*.3)/st)*st;if(lo<0&&Math.min(...vs)>=0)lo=0;
  const X=t=>pl+(t-x0)/((x1-x0)||1)*(W-pl-pr),Y=v=>pt+(hi-v)/((hi-lo)||1)*(H-pt-pb);
  let gl='';for(let v=lo;v<=hi+1e-9;v+=st){const y=Y(v).toFixed(1);gl+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${+y+4}" text-anchor="end">${fmt(v,st<1?1:0)}</text>`}
  const pts=ent.map((e,i)=>[X(xs[i]),Y(e.v)]),line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`;
  const lab=[0,Math.floor(ent.length/2),ent.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${X(xs[i]).toFixed(1)}" y="${H-8}" text-anchor="${i===0?'start':i===ent.length-1?'end':'middle'}">${fmtD(ent[i].d,{day:'numeric',month:'short'})}</text>`).join('');
  const L=pts[pts.length-1],gid='g'+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${gl}
    ${showG?`<line x1="${pl}" x2="${W-pr}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-pr+6}" y="${(Y(g)+4).toFixed(1)}" style="fill:var(--good);font-weight:700">цель ${fmt(g,1)}</text>`:''}
    <path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join('')}
    <circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/><text x="${(L[0]+10).toFixed(1)}" y="${(L[1]-9).toFixed(1)}" style="fill:var(--ink);font-weight:800;font-size:13px">${fmt(ent[ent.length-1].v,dec)}${unit}</text>${lab}</svg>`;
}

function vExProg(){

function ring(id,cls){const C=2*Math.PI*54;return `<div class="ringwrap"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="54" stroke-width="8"/><circle id="${id}" class="ring-fg ${cls}" cx="60" cy="60" r="54" stroke-width="8" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/></svg><div class="rv"><div><b id="${id}-v">0:00</b><span class="muted small" id="${id}-s"></span></div></div></div>`}
function setRing(id,frac,txt,sub){const c=document.getElementById(id);if(!c)return;const C=2*Math.PI*54;c.setAttribute('stroke-dashoffset',(C*(1-clamp(frac,0,1))).toFixed(1));const v=document.getElementById(id+'-v');if(v)v.textContent=txt;const s=document.getElementById(id+'-s');if(s&&sub!=null)s.textContent=sub}
function logSet(s){PL.log[curStep().i].sets.push(s);advance()}
function startStep(auto){const st=curStep();PL.stepStart=Date.now();
  if(st.time&&auto){beginTimed();return}

function advance(){
  const st=curStep();let rest=st.rest;

  if(rest<=0){startStep(true);return}
  PL.qj=Math.random()<.45;PL.q=PL.qj?joke():quote();
  PL.phase='rest';PL.restDur=rest;PL.restEnd=Date.now()+rest*1000;PL.beep=null;beep(520,.15);if(rest>=8&&!st.emom)say('Отдых');renderPlayer();
}
function beginTimed(){const st=curStep();PL.phase='timed';PL.timedStart=Date.now();PL.timedEnd=Date.now()+st.time*1000+300;PL.beep=null;T.cb.next=Date.now()+1500;T.cb.text='';bell(1);renderPlayer()}
function finishWorkout(){
  const ex=PL.log.filter(e=>e.sets.length);

/* ---------- звук, голос, экран ---------- */
let AC=null;
function ensureAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,t0=0,vol=.35,type='sine'){if(!S.settings.sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const beep=(f=880,d=.12)=>tone(f,d);
function bell(n=1){for(let k=0;k<n;k++){const t=k*.42;[[523,1.6,.3],[1046,1.2,.14],[1444,1,.08],[2090,.7,.05]].forEach(([f,d,v])=>tone(f,d,t,v))}}
function clap(){if(!S.settings.sound||!AC)return;try{for(let k=0;k<2;k++){const len=AC.sampleRate*.06,buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.5;s.buffer=buf;s.connect(g).connect(AC.destination);s.start(AC.currentTime+k*.18)}}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let ruVoice=null;
function say(t){if(!S.settings.voice||!t)return;try{const ss=window.speechSynthesis;if(!ss)return;if(!ruVoice)ruVoice=(ss.getVoices()||[]).find(v=>/^ru/i.test(v.lang))||null;ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=1.08;ss.speak(u)}catch(e){}}
let WL=null;
async function wake(on){const need=on||!!PL||T.rd.st.run||T.iv.st.run||T.rs.run;try{if(need&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!need&&WL){await WL.release();WL=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

function tick(){
  const now=Date.now();
  if(PL&&PL.phase!=='done'&&PL.phase!=='intro'){
    const e=document.getElementById('pl-elapsed');if(e)e.textContent=fmtDur((now-PL.start)/1000);
    if(PL.capEnd){const c=document.getElementById('pl-cap');if(c)c.textContent=fmtDur((PL.capEnd-now)/1000);const b=document.getElementById('pl-bar');if(b)b.style.width=(clamp((now-(PL.capEnd-PL.w.cap*1000))/(PL.w.cap*1000),0,1)*100).toFixed(1)+'%';
      if(now>=PL.capEnd){bell(3);say('Время вышло');finishWorkout();return}}
    const st=curStep();
    if(PL.phase==='rest'){const left=PL.restEnd-now,s=Math.ceil(left/1000);setRing('pl-ring',left/(PL.restDur*1000),fmtDur(s),'из '+fmtDur(PL.restDur));
      if(s===5&&PL.beep!=='n'&&PL.restDur>8){PL.beep='n';say('Приготовься. '+EX[PL.items[st.i].ex].name)}
      if(s<=3&&s>0&&PL.beep!==s){PL.beep=s;beep(660,.1)}
      if(left<=0){buzz([200]);startStep(true)}}
    if(PL.phase==='timed'){const it=PL.items[st.i],left=PL.timedEnd-now,s=Math.ceil(left/1000);const c=document.getElementById('pl-count');if(c)c.textContent=fmtDur(s);
      if(EX[it.ex].combo){comboTick(now,EX[it.ex].combo);const cb=document.getElementById('pl-combo');if(cb)cb.textContent=T.cb.text}
      if(isRound(it.ex)&&s===10&&st.time>20&&PL.beep!=='w'){PL.beep='w';clap()}
      if(s<=3&&s>0&&PL.beep!==s){PL.beep=s;beep(660,.1)}if(left<=0){bell(1);buzz([200]);logSet({t:st.time})}}
  }
  timerTick(now);
  if(ui.tab==='timer')timerPaint();
}

function addWeight(d,v,extra){v=parseFloat(String(v).replace(',','.'));if(!(v>20&&v<400)){toast('Введите вес в килограммах, например 78,4');return false}
  const i=S.weights.findIndex(w=>w.d===d),rec={d,w:r1(v)};Object.entries(extra||{}).forEach(([k,x])=>{const n=parseFloat(String(x).replace(',','.'));if(n>0)rec[k]=n});
  if(i>=0)S.weights[i]=Object.assign(S.weights[i],rec);else S.weights.push(rec);S.weights.sort((a,b)=>a.d<b.d?-1:1);touch('main');toast('Записано: '+fmt(rec.w,1)+' кг');return true}

  'fc-save':()=>{const fa=ui.fa,n=(fa.cn||'').trim(),k=parseFloat(fa.ck);if(!n||!(k>=0)){toast('Заполните название и калорийность');return}

  'pf-eq':v=>{const a=S.profile.eq||[];S.profile.eq=a.includes(v)?a.filter(x=>x!==v):[...a,v];touch('main');render()},

    if(DL){try{await DL.save({filename:name,data:json});toast('Копия сохранена')}catch(e){if(e&&e.code!=='declined')toast('Не удалось сохранить файл. Попробуйте ещё раз.')}return}
    try{const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Копия сохранена в «Загрузки»')}catch(e){toast('Не удалось сохранить файл')}},
  'import':()=>document.getElementById('imp').click(),
  tmode:v=>{T.mode=v;render()},
  'rd-toggle':()=>{const st=T.rd.st;ensureAudio();if(st.run){st.acc+=Date.now()-st.start;st.run=false}else{st.start=Date.now();st.run=true}wake();render()},
