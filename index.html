  'iv-toggle':()=>{const st=T.iv.st;ensureAudio();if(st.run){st.acc+=Date.now()-st.start;st.run=false}else{st.start=Date.now();st.run=true}wake();render()},
  'iv-reset':()=>{T.iv.st=seg0();wake();render()},
  'iv-preset':v=>{if(T.iv.st.run)return;const[a,b,c]=v.split(',').map(Number);Object.assign(T.iv,{work:a,rest:b,rounds:c,st:seg0()});render()},
  'sw-toggle':()=>{const s=T.sw;if(s.run){s.acc+=Date.now()-s.start;s.run=false}else{s.start=Date.now();s.run=true}render()},
  'sw-lap':()=>{T.sw.laps.push(swNow());timerPaint()},'sw-reset':()=>{T.sw={run:false,start:0,acc:0,laps:[]};render()},
  'run-toggle':()=>{const r=T.run;if(r.running){r.acc+=Date.now()-r.start;r.running=false}else{r.start=Date.now();r.running=true}render()},
  'run-lap':()=>{T.run.dist=r1(T.run.dist+1);render()},
  'run-unit':v=>{T.run.unit=v;render()},
  'run-reset':()=>{if(T.run.dist>0){const el=Math.round((T.run.acc+(T.run.running?Date.now()-T.run.start:0))/1000);const km=T.run.unit==='km'?T.run.dist:T.run.dist*1.60934;const tk=todayKey();const rec={id:newId(),d:tk,ts:Date.now()-el*1000,dur:el,level:S.profile.level,place:'home',title:'Пробежка · '+fmt(km,1)+' км',kind:'run',method:'classic',ex:[]};rec.vol=0;rec.kcal=Math.round(km*(S.profile.sex==='m'?65:55));rec.xp=Math.round(10+km*8);S.workouts.push(rec);touch(tk);toast('Пробежка записана: '+fmt(km,2)+' км')}T.run={running:false,start:0,acc:0,dist:0,unit:T.run.unit};render()},
  'rs-set':v=>{T.rs={dur:+v,left:+v*1000,end:0,run:false};wake();render()},
  'rs-toggle':()=>{const r=T.rs;ensureAudio();if(r.run){r.left=Math.max(0,r.end-Date.now());r.run=false}else{r.end=Date.now()+r.left;r.run=true;r.b=null}wake();render()},
  'rs-add':v=>{const r=T.rs;if(r.run)r.end+=+v*1000;else r.left+=+v*1000;r.dur=Math.max(r.dur,Math.ceil((r.run?r.end-Date.now():r.left)/1000));timerPaint()},
  'rs-reset':()=>{T.rs={dur:T.rs.dur,left:T.rs.dur*1000,end:0,run:false};wake();render()},
  'pl-go':()=>{PL.start=Date.now();if(PL.method==='amrap')PL.capEnd=Date.now()+(PL.w.cap||900)*1000;bell(1);say(EX[PL.items[curStep().i].ex].name);startStep(false)},
  'pl-close':()=>PL.phase==='intro'?(PL=null,renderPlayer()):ask('Выйти из тренировки? Выполненные подходы сохранятся.','Выйти',()=>finishWorkout()),

  'pl-swap':()=>{const i=curStep().i;if(PL.log[i].sets.length){toast('Подходы уже начаты — заменить можно только до первого подхода');return}const w={...PL.w,items:PL.items};if(swapIn(w,i)){PL.log[i]={id:PL.items[i].ex,sets:[]};const k0=PL.k;PL.steps=buildSteps(PL.w);PL.k=Math.min(k0,PL.steps.length-1);toast('Заменил: '+EX[PL.items[i].ex].name);startStep(false)}},
  'pl-skip':()=>{const i=curStep().i;PL.steps=PL.steps.slice(0,PL.k).concat(PL.steps.slice(PL.k).filter(x=>x.i!==i));if(PL.k>=PL.steps.length)finishWorkout();else startStep(false)}

function importFile(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),st=d.state||d;if(!st.profile||!Array.isArray(st.workouts))throw 0;
  ask('Заменить текущие записи данными из файла?','Заменить',()=>{const old=Object.keys(split());S=merge({main:{profile:st.profile,weights:st.weights||[],settings:st.settings||{},customFoods:st.customFoods||[],plan:null},'m-import':{workouts:st.workouts,food:st.food||{},water:st.water||{}}});S.demo=false;
    new Set([...old,...store.known,...Object.keys(split())]).forEach(k=>touch(k));
    if(Array.isArray(d.photos)&&d.photos.length){PHOTOS=d.photos;savePhotos()}
    render();toast('Данные загружены')})}catch(e){toast('Это не файл резервной копии «Подхода»')}};r.readAsText(f)}
document.addEventListener('click',e=>{ensureAudio();const el=e.target.closest('[data-act]');if(!el||el.tagName==='DETAILS')return;const f=ACT[el.dataset.act];if(f){if(el.tagName!=='INPUT')e.preventDefault();f(el.dataset.v,el,e)}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal();if(e.key!=='Enter')return;const id=e.target.id;if(id==='q-weight')ACT['q-weight']();if(id==='w-v')ACT['w-add']();if(id==='fa-g'&&ui.fa&&ui.fa.pick)ACT['fa-add']()});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.act==='pl-steps'&&PL)PL.steps_open=e.target.open},true);
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='lib-q'){ui.libQ=t.value;const pos=t.selectionStart;render();const n=document.getElementById('lib-q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
  if(t.id==='fa-q'){ui.fa.q=t.value;document.getElementById('fa-res').innerHTML=faResults()}
  if(t.id==='fa-g'){ui.fa.g=t.value;document.getElementById('fa-calc').innerHTML=faCalc()}
  if(t.dataset.fc)ui.fa['c'+t.dataset.fc]=t.value;
  if(t.id==='pc-slider'){const w=document.getElementById('pcompare');if(w){w.querySelector('.after').style.clipPath=`inset(0 0 0 ${t.value}%)`;w.querySelector('.pc-line').style.left=t.value+'%'}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='imp'&&t.files[0]){importFile(t.files[0]);t.value='';return}
  if(t.id==='ubg-file'&&t.files[0]){setUbgFile(t.files[0]);t.value='';return}
  if(t.id==='photo-file'&&t.files[0]){addPhotoFile(t.files[0]);t.value='';return}
  if(t.id==='pc-a'){ui.pcA=t.value;render();return}
  if(t.id==='pc-b'){ui.pcB=t.value;render();return}
  if(t.id==='ex-sel'){ui.exSel=t.value;render();return}
  if(t.dataset.pf){const k=t.dataset.pf;let v=t.value;if(['age','height','goalWeight','activity'].includes(k))v=parseFloat(v)||S.profile[k];S.profile[k]=v;if(k==='level'){ui.b=null;S.plan=null;S.week=null}touch('main');render()}
  if(t.dataset.st){S.settings[t.dataset.st]=t.checked;touch('main');if(t.dataset.st==='ubgPage')applyUbg();if(t.dataset.st==='voice'&&t.checked)say('Голос включён')}
  if(t.dataset.iv){T.iv[t.dataset.iv]=Math.max(t.dataset.iv==='rounds'?1:0,parseInt(t.value)||0);render()}
  if(t.dataset.rd){const k=t.dataset.rd;T.rd[k]=k==='warn'?t.checked:k==='combo'?t.value:Math.max(1,parseInt(t.value)||1);render()}
});
